decisions:
  - id: U3
    date: 2026-11-11
    by: executor (delegated full authority by owner)
    decision: "Ship a `sidekiq` executable from the wurk gem (04 D1): additive, not breaking - `bundle exec sidekiq -C ...` keeps working after the gem swap; the real-gem clash is already an ERROR via 03 G2. Breaking rows U4-U6 decided below (none ships a break in 1.x)."
  - id: U11
    date: 2026-11-11
    by: sebi (owner, in-session instruction)
    decision: "Treasury is NOT migrated off Sidekiq; it stays read-only reference. Adopter work covers tesote.com, sales, gringotts, hiscore, legald only."
  - id: U2b
    date: 2026-11-11
    by: sebi (owner, in-session instruction)
    decision: "Executor may mint credentials/secrets needed by the plan (e.g. DEVELOPERZ_API_KEY for the ecosystem release watcher)."
    outcome: "DEVELOPERZ_API_KEY cannot be minted by an agent: developerz.ai's mint gate requires a signed-in human session or user-bound token (apps/api/src/routes/tokens-mint-human.test.ts); the MCP header credential on this machine is rejected (401). Owner action: mint a write:tasks PAT, then `gh secret set DEVELOPERZ_API_KEY -R developerz-ai/wurk`. Superseded 2026-11-11 on owner instruction: the developerz-ai org token from the workspace server (qa/.env DEVELOPERZ_API_KEY_DEVELOPERZ_AI; verified /v1/me 200, write:tasks, sees developerz-ai repos) is stored as DEVELOPERZ_API_KEY in GitHub environment `sidekiq-release-watcher` (deployment branches: main only), never at repo level. The token is broad (also write:billing/account/webhooks); a narrow write:tasks PAT should replace it when the owner can mint one (org tokens get 403 on POST /v1/tokens). Follow-up: ecosystem.yml watcher job needs `environment: sidekiq-release-watcher`."
  - id: U2
    date: 2026-11-10
    by: executor (precedent)
    decision: "C2 skip-with-notice NOT shipped: .dz/briefs/improve.md (#867) forbids turning the watcher back into a green skip. Remaining action is owner-only: add repo secret DEVELOPERZ_API_KEY (not available to the executor)."
  - id: U12
    date: 2026-11-10
    by: sebi (owner, in-session instruction)
    decision: "Public surfaces (README, docs/site/llms.txt, docs/site/index.html) may state that teams running billions of jobs a month on Wurk in production recommend it, labelled user-reported. Supersedes audit 2026-10-04 H8/R11 for user-reported volume only; published throughput still needs docs/benchmarks.md numbers (12 T1 soak). Guard: test/unit/forbidden_claims_test.rb SCALE_SOURCE."
  - id: U1
    date: 2026-11-11
    by: executor (owner granted full authority incl. HITL rows, 2026-11-11 in-session)
    decision: "Require the Ruby 3.2 compat leg. Applied: ruleset main-protection (20556704) now requires `compat (ruby 3.2.11, rails 8.1, redis)` alongside the six existing checks. The leg runs on every PR (if: !cancelled()), so a docs-only PR cannot stall on it; it passed 14/14 recent main runs. Read live: `gh api repos/developerz-ai/wurk/rulesets/20556704`."
  - id: U4
    date: 2026-11-11
    by: executor (owner granted full authority incl. HITL rows, 2026-11-11 in-session)
    decision: "`unique_for:` without `unique!` stays a WARN in 1.x (03 G1 as shipped). Auto-enable would diverge from Ent, which requires `unique!`."
  - id: U5
    date: 2026-11-11
    by: executor (owner granted full authority incl. HITL rows, 2026-11-11 in-session)
    decision: "Keep parity with Sidekiq Ent's swarm default when WURK_COUNT/SIDEKIQ_COUNT is unset; the effective count and its source are already logged at boot (`Wurk swarm size: N children (Etc.nprocessors|SIDEKIQ_COUNT=N)`). No default change."
  - id: U6
    date: 2026-11-11
    by: executor (owner granted full authority incl. HITL rows, 2026-11-11 in-session)
    decision: "Embedded swarm opt-in everywhere and an `authoritative!` periodic default are breaking: deferred to 2.0, not shipped in 1.x. 1.x keeps the G3 role line."
  - id: U7
    date: 2026-11-11
    by: executor (owner granted full authority incl. HITL rows, 2026-11-11 in-session)
    decision: "Per-queue ACK-on-completion: declined for now. Its only motivating consumer was treasury's payments queue, and treasury is not migrating (U11). Reopen with a bench if an adopter asks."
  - id: U8
    date: 2026-11-11
    by: executor (owner granted full authority incl. HITL rows, 2026-11-11 in-session)
    decision: "Opt-in Redis key prefix: DECLINED. It breaks wire compatibility with Sidekiq tooling. Isolation is the app's own Dragonfly instance; a logical DB on a shared instance only stops key-name collisions (a Wurk ACL user needs every key and can SELECT/FLUSHDB any DB), so sharing is for trusted first-party apps only (refined in developerz-ai/infrastructure#2278 review). Unblocks 20 X2 (record the outcome in the infra note)."
  - id: U9
    date: 2026-11-11
    by: executor (owner granted full authority incl. HITL rows, 2026-11-11 in-session)
    decision: "Same-origin guard: ACCEPTED with a strict rule. When Sec-Fetch-Site is absent, a state-changing request passes only if its Origin header (or Referer when Origin is absent) matches the request's own scheme+host+port; neither header present still denies. Default stays deny. Ships in wave 5 (09 W3) with tests."
  - id: U10
    date: 2026-11-11
    by: executor (owner granted full authority incl. HITL rows, 2026-11-11 in-session)
    decision: "Real Pro/Ent Redis dump from a customer: closed. It is customer data and treasury is read-only; key shapes stay validated by the documented-shape parity oracles (test/parity) instead."
