notes: "Findings from five-agent audit 2026-07-31 (lifecycle / execution+web / frontend+tests / logic / perf). Slices 01-06, 09 and 10 landed; everything through d00be0d ships in Wurk 1.4.0. Slice 07's F6 landed in PR #359 (1.4.0 release). Slice 07's remaining S9/S10/S11/S13 landed via docs/plans/2026/08/06/101-faster-than-sidekiq/07-leaks-raii.md (PR #392) — that plan's slice 07 explicitly absorbed and closed them. Slice 08-perf-quick-wins.md (P1-P13) is superseded in full by docs/plans/2026/08/06/101-faster-than-sidekiq/ (slices 01-08), which re-scoped and re-measured the same perf territory from scratch rather than picking up the old P-numbered list. Slice 10 landed whole via PR #343 (seven commits, T1-T5/T9/T11/T12); its source branch test/liveness-probe-teardown is deleted upstream — nothing to cherry-pick, and any resurrected copy predates slices 01/02 and would revert landed work. Open item this plan leaves behind: F13/F14/F15 (see slice-07 evidence above) — logic bugs, not leaks or perf, out of scope for the superseding plan; file a new issue before picking them up."
