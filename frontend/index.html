<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090b" />
    <!-- The dashboard is dark-only. Tell the Dark Reader extension not to
         re-invert it — otherwise it washes the already-dark UI to white. -->
    <meta name="darkreader-lock" />
    <meta
      name="description"
      content="Wurk — a free, faster, 100% drop-in replacement for Sidekiq + Sidekiq Pro + Sidekiq Enterprise. Real fork-based parallelism, mountable Rails engine, live dashboard."
    />

    <!-- Icons (served by the engine under /wurk-assets/). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/wurk-assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/wurk-assets/favicon-16.png" />
    <link rel="icon" type="image/png" href="/wurk-assets/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/wurk-assets/apple-touch-icon.png" />

    <!-- Open Graph. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wurk — Background jobs dashboard" />
    <meta
      property="og:description"
      content="Wurk — a free, faster, 100% drop-in replacement for Sidekiq + Sidekiq Pro + Sidekiq Enterprise. Real fork-based parallelism, mountable Rails engine, live dashboard."
    />
    <meta property="og:image" content="/wurk-assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wurk — Background jobs dashboard" />
    <meta
      name="twitter:description"
      content="Wurk — a free, faster, 100% drop-in replacement for Sidekiq + Sidekiq Pro + Sidekiq Enterprise. Real fork-based parallelism, mountable Rails engine, live dashboard."
    />
    <meta name="twitter:image" content="/wurk-assets/og-image.png" />

    <title>Wurk — Background Jobs</title>
  </head>
  <body>
    <div id="wurk-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
