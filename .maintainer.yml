# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy — developerz-ai/wurk
#
# Dogfood pass with coding handoff live. The bot triages (qualifies, labels,
# asks reporters for repro) and, once a task is ready, dispatches coding to the
# fleet over the webhook handoff. Auto-merge is ON (dz#789 dependency-PR lane
# dogfood): green routine PRs — including Dependabot minors — merge on CI +
# gates; majors still stop on ask_before_acting (major_dep_bump). We still wait
# for reviewer bots (coderabbit/copilot) to settle before acting. Everything
# not set here uses the schema defaults (release: release-please, so merged
# waves cut a batched release).
version: 1

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question]
  # Dogfood: lower than the 0.6 default so a moderately-scoped plan hands off to
  # the coding fleet instead of escalating for review (exercises the handoff loop).
  confidence_threshold: 0.4

handoff:
  mode: webhook
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit, copilot]
  # Restored 2026-07-28: the pin below has been lifted because the condition it
  # named is met. It read "RESTORE auto_merge: true once #1080 is merged" —
  # developerz-ai/developerz.ai#1080 (the 120s review-absence hole, where a PR
  # whose COMMIT was older than two minutes merged with zero review from anyone)
  # closed COMPLETED on 2026-07-27 via #1113 and #1127. This repo still has no
  # branch-protection ruleset, so that gate was the whole protection — which is
  # exactly why the pin was written with a precondition instead of a date.
  #
  # Back to this repo's deliberate dz#789 posture: green routine PRs — Dependabot
  # minors included — merge on CI + gates; majors still stop on
  # ask_before_acting (major_dep_bump), and we still wait for the reviewer bots
  # above to settle first.
  auto_merge: true

escalate:
  always: [security, license, cla]
  ask_before_acting: [breaking_change, major_dep_bump, first_time_contributor, large_pr]

limits:
  max_comments_per_issue_per_day: 10
