# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy — developerz-ai/wurk
#
# Dogfood pass with coding handoff live. The bot triages (qualifies, labels,
# asks reporters for repro) and, once a task is ready, dispatches coding to the
# fleet (handoff.mode: fleet). Auto-merge is OFF (pinned 2026-08-01 — see the
# pr: block): this file was schema-invalid until now, so the platform ran
# defaultPolicy (auto_merge false), and making the file valid must not change
# the merge posture. `pr.auto_merge: false` is in fact the ONLY merge gate this
# repo has — the live `main-protection` ruleset carries deletion +
# non_fast_forward and a pull_request rule with
# required_approving_review_count: 0 and no required-status-checks rule, so
# nothing outside this file holds a merge back. (Read off the ruleset
# 2026-08-27. The note that stood here — "legacy branch protection exists (1
# required review + the test matrix)" — has been false since that ruleset
# replaced it on 2026-08-07; wurk#445 flagged it, wurk#388 was the outage it
# was created to end.) We still wait
# for reviewer bots (coderabbit/copilot) to settle before acting. The native
# review: block below activates the developerz review lane alongside CodeRabbit
# (force: true, advisory — never requests changes, never approves). Everything
# not set here uses the schema defaults. release: is now declared explicitly
# (see the release: block) rather than inherited, because the inherited default
# described a lane this repo does not run.
version: 1

tone:
  voice: friendly
  language: en

triage:
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question]
  # Dogfood: lower than the 0.6 default so a moderately-scoped plan hands off to
  # the coding fleet instead of escalating for review (exercises the handoff loop).
  confidence_threshold: 0.4

handoff:
  # `fleet`, not `webhook`: both grant HandoffWebhook
  # (developerz-ai/developerz.ai packages/tools/src/policy-gate.ts:83) but `fleet`
  # needs no `webhook_ref` (packages/policy/src/validate.ts:130, dz#1026), and the
  # `wh_fleet_placeholder` ref that used to sit here resolved to no row and threw
  # WebhookRefNotFoundError — the org account has zero registered webhooks, so
  # the ingest graded the WHOLE file INVALID and served defaultPolicy instead
  # (wurk#432). Every declared value below only takes effect once this is gone.
  # This key is also the opt-in for the autonomous scout backlog-drain
  # (apps/worker/src/cron/scout-backlog-drain.ts:22-29), which stays inert until
  # dz#1249 and dz#1530 close. Enrolling wurk was authorized by Ivan (ivndev001)
  # 2026-08-21 on wurk#445.
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit, copilot]
  # PINNED OFF 2026-08-01 (operator decision, developerz-ai/wurk#345). Until
  # wurk#432/#445 the file was semantically invalid (handoff.webhook_ref named
  # no registered webhook), so the platform discarded it whole and ran
  # defaultPolicy — whose pr.auto_merge is false. Activating the file with the
  # previously declared `true` would have flipped auto-merge ON with nothing
  # behind it: the `main-protection` ruleset requires zero approving reviews and
  # no status checks, so a routine PR would merge on green CI alone, no human in
  # the loop. This line IS the gate. Activation must be behavior-preserving on
  # the merge posture; every other declared value activates as written. The dz#789
  # dependency-PR lane posture (green routine PRs merge on CI + gates) is
  # restored only behind a ruleset or a fresh explicit operator decision.
  # NOTE (wurk#347): this governs the platform BOT only. Non-major Dependabot
  # updates are also targeted by a separate GitHub-native GHA lane
  # (.github/workflows/dependabot-automerge.yml, dz#789) that this policy does
  # not govern. Repo auto-merge is enabled, so that lane is not inert by config
  # — yet every Dependabot PR so far (#299-304) was merged by hand, so in
  # practice a human still gates merges on this repo. auto_merge: false scopes
  # the platform bot; it does not control the GHA lane.
  auto_merge: false

review:
  enabled: true
  force: true                 # CodeRabbit is active on wurk; without this we defer forever
  depth: inline               # not deep — no checkout guarantee, avoids review.depth_unservable
  profile: chill
  request_changes: false      # first live pass must not block a merge
  approval: false             # first live pass must not APPROVE
  high_level_summary: true
  learnings: false            # no KB write-back on a public repo yet
  chat_auto_reply: true       # keep on — the reply lane is the positive control
  auto_review:
    enabled: true
    incremental: true
    drafts: false
    base_branches: [main]     # verified: wurk's default branch is main
    ignore_title_keywords: [WIP, "DO NOT MERGE"]
  anti_noise:
    severity_floor: minor
    max_comments: 10          # DELIBERATE — pins defaultAntiNoise's 10, defeats the schema's 30
    dedupe: true
  path_filters: []
  path_instructions: []

release:
  # DECLARED, not inherited (wurk#328). The schema default is
  # manager: release-please, which implies batched release PRs driven by
  # release-please-config.json + .release-please-manifest.json. Neither file
  # exists here and no release PR has ever been opened, so the inherited
  # default described a lane this repo does not run.
  #
  # What actually cuts a release:
  #   1. a version bump to lib/wurk/version.rb lands on main
  #   2. .github/workflows/release.yml fires on that path, publishes to RubyGems
  #      via OIDC trusted publishing, and only then cuts the tag + GitHub Release
  #      from the CHANGELOG section
  #
  # `none` is the only value in the enum (release-please | none) that describes
  # that, and it means "no release MANAGER" — it does not govern the agent's
  # note generation, which the schema does not model at all.
  manager: none
  # EMPTIED 2026-08-11 (wurk#420). `manager: none` did NOT stop the agent from
  # cutting releases — `channels: [github-release]` did that independently, and
  # it fired on feature merges with Wurk::VERSION unbumped. Six times (v1.2.1,
  # v1.5.0, v1.6.0, v1.7.0, v1.8.0, v1.7.1, v1.7.2) that produced a tag and a
  # GitHub Release marked "Latest" with no gem behind it, while `gem install
  # wurk` kept serving the previous version — and a red release run each time.
  # release.yml owns the whole lane end to end (gem first, then tag + Release
  # from the CHANGELOG), so there is no channel left for the agent to publish on.
  # The registry channels (incl. rubygems) are reserved and REJECTED at
  # validation time regardless; RubyGems is declared by release.yml's OIDC step.
  channels: []

escalate:
  always: [security, license, cla]
  ask_before_acting: [breaking_change, major_dep_bump, first_time_contributor, large_pr]

limits:
  max_comments_per_issue_per_day: 10
