# No `self-hosted-runner:` block, deliberately — do not repopulate it.
#
# Every `runs-on` that can select non-hosted hardware is now an expression
# (`${{ ... vars.WURK_CI_RUNNER ... }}`), not a literal label, so no workflow
# contains a self-hosted label for actionlint to check. Verified with actionlint
# 1.7.12: a job whose `runs-on` is such an expression produces zero diagnostics,
# because actionlint cannot evaluate `vars` and skips the `runner-label` check
# entirely. Declaring labels here would therefore be inert, not protective.
#
# What this costs, stated plainly: no static check survives to catch a typo'd
# runner. The real silent failure is not a typo'd label anyway but a typo'd
# VARIABLE name — `vars.WURK_CI_RUNER` resolves to empty, falls through to
# `ubuntu-latest`, and yields green CI indistinguishable from the intended
# fallback, so the cutover simply never happens and nothing complains. Guard it
# by grepping the expression sites, not by trusting a green run.
#
# This file is now read by the `actionlint` job in .github/workflows/test.yml
# (added for #484). The job pins the actionlint binary to v1.7.12 by SHA, runs
# on every PR, and gates per-step on a `workflows` paths-filter so it always
# reports a status — even on a PR whose diff doesn't touch a workflow.
