# Dependabot config. Minor+patch grouped per ecosystem to keep PR noise low
# (majors still open individually — except the github-actions group, which
# also takes majors; a group carrying a major is still left for human review by
# dependabot-automerge.yml, which reads the group's highest update type). The shipped
# gem's deps and the dashboard's move weekly; the CI actions and the Dockerfile
# base images move monthly, because a weekly cadence there was mostly one PR per
# setup-ruby patch release (#534, #540) for no change in what CI runs.
# Bundler is scoped to the root Gemfile (the shipped gem via the gemspec);
# test/dummy, demo, and test/ecosystem Gemfiles are fixtures, not shipped deps.
# Gem bumps wait 14 days after a version is published (cooldown) so brand-new
# releases can be yanked/fixed upstream before we pick them up. The docker
# ecosystem watches the Dockerfile's pinned base images alongside bundler, bun,
# and github-actions.
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    # The Gemfile pins dev tools tightly (rubocop & co. at `~> X.Y.0`). With a
    # gemspec and no committed lockfile, the default `auto` strategy treats this
    # as a library and WIDENS such a pin (`>= X.Y, < X.Z+1`) instead of moving
    # it, which silently un-pins the linter. `increase` rewrites the pin to the
    # new version. Gemspec runtime requirements are handled separately by
    # dependabot (only touched when they exclude the new version).
    versioning-strategy: increase
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # `bun`, not `npm`: the frontend's lockfile is frontend/bun.lock, which the
  # npm ecosystem cannot read (it failed every run with misconfigured_tooling
  # and froze frontend deps). The bun ecosystem updates package.json AND
  # bun.lock in the same PR, so `bun install --frozen-lockfile` in CI passes
  # without the old post-hoc lockfile-reconcile workflow (#541, #470).
  - package-ecosystem: bun
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  # Every action is SHA-pinned and reviewed as one diff, so majors join the
  # group too: the July 2026 batch was four separate major PRs (#330-#333) for
  # one afternoon's review. dependabot-automerge.yml still leaves a group that
  # carries a major for a human.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
  # docker covers the Dockerfile's two base images (oven/bun and
  # ruby:3.4-slim-bookworm). When dependabot bumps the oven/bun tag, every other
  # bun pin must move with it, and dependabot cannot edit those: the
  # `bun-version:` inputs in .github/workflows/test.yml and
  # .github/workflows/release.yml, and `bun` in mise.toml
  # (`grep -rn 'bun-version\|^bun' .github mise.toml` finds them all).
  # test/unit/toolchain_pins_test.rb fails the docker PR until every pin names
  # the same version, so the PR stays red until whoever or whatever is fixing
  # it pushes the matching pin edits to the dependabot branch.
  # Ruby major updates are ignored: release.yml holds the release job on 3.4
  # on purpose, so a major bump would break the gem publish job until pages/
  # release are revisited.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "ruby"
        update-types:
          - "version-update:semver-major"
