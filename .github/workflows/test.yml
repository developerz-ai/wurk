name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo (artifact upload doesn't
# need a broader GITHUB_TOKEN scope). pull-requests:read is for the `detect`
# gate — paths-filter reads the PR's changed-file list on pull_request events.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repo does this change touch? Everything below keys off
  # these outputs, so a docs-only PR stops paying for the full Ruby matrix.
  #
  # PULL REQUESTS ONLY. On push-to-main every job runs unconditionally: main is
  # what `release:check` and the tag build trust, so its history stays fully
  # verified regardless of what a given commit touched.
  # Runner selection is a repository variable rather than a hard-coded label, so
  # pointing CI at different hardware — or rolling back — is a settings change
  # with no PR and no merge. Two properties of the expression are load-bearing.
  # The fork guard comes first: wurk is public, a fork PR runs attacker-authored
  # code, and GitHub's own guidance is never to let that reach self-hosted
  # hardware. And an unset variable falls through to hosted compute, so a
  # cleared or typo'd variable degrades to working CI rather than to a job that
  # can never be scheduled. On `push` events the fork operand is null (falsy),
  # which lands on the same fallback.
  detect:
    name: detect changed paths
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.WURK_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      ruby: ${{ steps.filter.outputs.ruby }}
      frontend: ${{ steps.filter.outputs.frontend }}
      specdocs: ${{ steps.filter.outputs.specdocs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ruby:
              # docs/wiki/** is source for the public wiki and its only gate is
              # test/unit/wiki_pages_test.rb, inside this suite. Without it here
              # a wiki-only PR skips the Ruby job and reports green having never
              # run the guard — and merging goes on to publish the page.
              - 'docs/wiki/**'
              - 'lib/**'
              - 'app/**'
              - 'exe/**'
              - 'bin/**'
              - 'test/**'
              - 'tasks/**'
              - 'config/**'
              - 'frontend/**'
              # Gemfile.lock is deliberately absent from the filter — it is gitignored
              # (.gitignore:5) and can never appear in a diff; `Gemfile` and the gemspec are
              # what actually move dependencies.
              - 'Gemfile'
              - 'Rakefile'
              - '*.gemspec'
              - '.github/workflows/test.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/test.yml'
            specdocs:
              - 'docs/target/**'
              - '.github/workflows/test.yml'

  # ONE full run of the Ruby suite, on the newest Ruby and the newest Rails,
  # with the coverage gate folded into it.
  #
  # It used to be four: a three-leg version matrix (3.3/8.0, 3.4/7.2, 4.0/8.0)
  # plus a separate `coverage` job that ran the identical suite a second time
  # under SimpleCov. That is four executions of the same tests to answer two
  # questions, and the version matrix was pinned to Rails lines (7.2, 8.0) that
  # are no longer the newest anyway. Wurk targets current Ruby and current
  # Rails; the floor in the gemspec (>= 3.2) is held by rubocop's
  # `TargetRubyVersion: 3.2`, which rejects syntax and APIs newer than it.
  #
  # Stays 4 vCPU: the suite forks 4 parallel workers (test_helper's NCPU
  # default, which is deliberately below core count — its integration layer
  # boots real swarms, so one worker per core oversubscribes and turns
  # wall-clock pressure into red builds). A bigger box would idle.
  test:
    name: test + coverage (latest ruby/rails)
    needs: detect
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.WURK_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4
        # Container port only: Docker binds a free HOST port and the job reads
        # it back below. A hosted runner owns its VM, so 6379 is always free
        # there; several self-hosted runners sharing one Docker daemon make the
        # second concurrent job die on `port is already allocated`, which
        # surfaces as flaky CI rather than as an obvious misconfiguration.
        ports: ["6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
          --health-start-period 1s
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      RUBY_VERSION: "4.0"
      RAILS_VERSION: "8.1"
      COVERAGE: "1"
      # Gated per STEP, not per job, so this job always reports a status even on
      # a docs-only PR: a job-level `if:` reports "skipped", and anything that
      # later marks this check required would park such a PR on "Expected —
      # waiting for status" forever. On an irrelevant change it just does nothing.
      RUN: ${{ github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Must be a STEP: the `job` context is available in
      # `jobs.<id>.steps.env` but NOT in `jobs.<id>.env`, so the host port
      # Docker assigned above cannot be read from the job-level `env:` block.
      - name: resolve redis port
        if: env.RUN == 'true'
        run: echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}/0" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        if: env.RUN == 'true'
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          cache-version: rails-${{ env.RAILS_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.RUN == 'true'
        with:
          bun-version: "1.4.0"
      # Pin Node too. Bun runs the scripts, but vitest executes test files in
      # Node worker threads and Vite's toolchain resolves against Node — so an
      # unpinned Node is a silent, moving dependency of every frontend run. It
      # is what broke the jsdom 30 bump (#372): the runner image's Node was
      # below jsdom 30's floor, `undici` loaded without
      # `webidl.util.markAsUncloneable`, and all 17 vitest workers failed to
      # boot. Floor comes from jsdom's `engines.node`; mirrored in
      # frontend/package.json so a local `bun install` warns on a mismatch.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.RUN == 'true'
        with:
          node-version: "24"
      # Cache Bun's global download cache so `bun install --frozen-lockfile`
      # (run here directly in `frontend`, and via `rake frontend:build` in the
      # test/coverage legs) reuses tarballs instead of re-fetching them each run.
      # Best-effort by design: actions/cache warns and continues on a restore
      # miss or a save failure, so this step can never fail the job. Keyed on the
      # frontend lockfile; the shared key is intentional so every matrix leg and
      # job reuses one cache.
      - name: cache bun install cache
        if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: build dashboard SPA
        if: env.RUN == 'true'
        run: bundle exec rake frontend:build
      - name: dummy app setup
        if: env.RUN == 'true'
        run: |
          cd test/dummy
          bundle install
          bin/rails db:prepare
      # COVERAGE=1 is set for the whole job, so this one invocation is both the
      # test gate and the blocking line+branch coverage gate (>= 90% each, from
      # test_helper's SimpleCov config). The Cobertura report is still uploaded
      # for per-file inspection.
      - name: rake test (with coverage gate)
        if: env.RUN == 'true'
        run: bundle exec rake test
      - name: upload coverage report
        if: always() && env.RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/coverage.xml
          if-no-files-found: warn

  # Oracle suite: independently written oracles for the documented Sidekiq
  # behaviour, pinned to the upstream revision in test/parity/.sidekiq_sha.
  # Its own dedicated job so a parity divergence is legible at a glance rather
  # than buried in the main suite's output. Needs neither the dashboard bundle
  # nor a Node toolchain, which is why it stays a 4vcpu job that finishes in
  # well under a minute.
  parity:
    name: parity (oracle)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.WURK_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4
        ports: ["6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
          --health-start-period 1s
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      RAILS_VERSION: "8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # STEP, not job-level `env:` — see the `test` job above.
      - name: resolve redis port
        run: echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}/0" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          # Same key the `test` job populates, so this job installs from cache.
          cache-version: rails-8.1
      - name: rake test:parity
        run: bundle exec rake test:parity

  # Guard against deleted/truncated spec docs (the authoritative oracles for
  # parity). This is a quick, standalone check that doesn't require Redis or Ruby.
  spec-docs:
    name: spec docs (exist + non-empty)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.specdocs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check spec docs
        run: |
          for file in docs/target/sidekiq-free.md docs/target/sidekiq-pro.md docs/target/sidekiq-ent.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file does not exist"
              exit 1
            fi
            if [ ! -s "$file" ]; then
              echo "ERROR: $file is empty"
              exit 1
            fi
            echo "✓ $file exists and is non-empty ($(wc -l < "$file") lines)"
          done

  # Ruby linting — nothing runs rubocop today, so this closes that gap.
  # Paired with the `frontend` and `spec-docs` jobs as quick, parallel checks.
  lint:
    name: lint (rubocop)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.WURK_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}:lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: rails-8.1
      # RuboCop's own result cache, keyed on the config that invalidates it plus
      # the ref, so a re-run of the same branch re-inspects only what changed.
      # Best-effort: actions/cache warns and continues on a miss, so this step
      # can never fail lint.
      - name: cache rubocop results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rubocop_cache
          key: ${{ runner.os }}-rubocop-${{ hashFiles('.rubocop.yml', 'Gemfile') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rubocop-${{ hashFiles('.rubocop.yml', 'Gemfile') }}-
            ${{ runner.os }}-rubocop-
      - name: rubocop
        run: bundle exec rubocop --parallel

  # The matrix `test` and `coverage` jobs only *build* the SPA (tsc + vite) via
  # `rake frontend:build`; hand-written frontend types can typecheck clean yet
  # null-render at runtime (#272), so the build alone is not a regression gate.
  # This dedicated Node-only job runs the dashboard's Vitest suite on every PR
  # (no Ruby/Redis needed; the suite is fast). Closes #273.
  frontend:
    name: frontend (vitest)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.frontend == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.WURK_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      # See the `test` job for why Node is pinned alongside Bun. This is the
      # job that actually runs vitest, so it is the one the pin exists for.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Cache Bun's global download cache so `bun install --frozen-lockfile`
      # (run here directly in `frontend`, and via `rake frontend:build` in the
      # test/coverage legs) reuses tarballs instead of re-fetching them each run.
      # Best-effort by design: actions/cache warns and continues on a restore
      # miss or a save failure, so this step can never fail the job. Keyed on the
      # frontend lockfile; the shared key is intentional so every matrix leg and
      # job reuses one cache.
      - name: cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: install dashboard deps
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: typecheck
        run: bun run typecheck
        working-directory: frontend
      # oxlint, not eslint: typescript-eslint peer-depends on
      # `typescript >=4.8.4 <6.1.0`, and this dashboard builds on TypeScript 7,
      # so its parser cannot read a single .ts/.tsx file here
      # (typescript-eslint#10940, still open). oxlint parses TS/TSX itself and
      # has no `typescript` peer at all. `--deny-warnings` is what makes it a
      # gate rather than a report; enabled rules live in frontend/.oxlintrc.json.
      - name: lint
        run: bun run lint
        working-directory: frontend
      - name: vitest
        run: bun run test
        working-directory: frontend
