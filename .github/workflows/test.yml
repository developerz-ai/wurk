name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo (artifact upload doesn't
# need a broader GITHUB_TOKEN scope). pull-requests:read is for the `detect`
# gate — paths-filter reads the PR's changed-file list on pull_request events.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repo does this change touch? Everything below keys off
  # these outputs, so a docs-only PR stops paying for the full Ruby matrix.
  #
  # PULL REQUESTS ONLY. On push-to-main every job runs unconditionally: main is
  # what `release:check` and the tag build trust, so its history stays fully
  # verified regardless of what a given commit touched.
  detect:
    name: detect changed paths
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      ruby: ${{ steps.filter.outputs.ruby }}
      frontend: ${{ steps.filter.outputs.frontend }}
      specdocs: ${{ steps.filter.outputs.specdocs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            ruby:
              - 'lib/**'
              - 'app/**'
              - 'exe/**'
              - 'bin/**'
              - 'test/**'
              - 'tasks/**'
              - 'config/**'
              - 'frontend/**'
              - 'Gemfile'
              - 'Gemfile.lock'
              - 'Rakefile'
              - '*.gemspec'
              - '.github/workflows/test.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/test.yml'
            specdocs:
              - 'docs/target/**'
              - '.github/workflows/test.yml'

  test:
    needs: detect
    # No explicit `name:` — GitHub's default matrix naming emits
    # "test (<ruby>, <rails>)", which branch protection (strict: true) requires
    # byte-identical for "test (3.4, 7.2)" and "test (4.0, 8.0)" (merge-gated).
    # Trimmed from the 7-leg 3.2/3.3/3.4 × 7.2/8.0 matrix (#290): the two
    # required legs plus one non-edge middle combo (3.3/8.0) for coverage.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.3"
            rails: "8.0"
          - ruby: "3.4"
            rails: "7.2"
          - ruby: "4.0"
            rails: "8.0"
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      RAILS_VERSION: ${{ matrix.rails }}
      REDIS_URL: redis://localhost:6379/0
      # Gated per STEP, not per job. "test (3.4, 7.2)" and "test (4.0, 8.0)" are
      # required checks under branch protection, and GitHub does not count a
      # skipped required check as satisfied — a job-level `if:` would park every
      # docs-only PR on "Expected — waiting for status" forever. So the job always
      # runs and reports success; on an irrelevant change it just does nothing.
      RUN: ${{ github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        if: env.RUN == 'true'
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Each Rails leg resolves a different lock; isolate the gem cache.
          cache-version: rails-${{ matrix.rails }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: env.RUN == 'true'
        with:
          bun-version: "1.3.14"
      # Cache Bun's global download cache so `bun install --frozen-lockfile`
      # (run here directly in `frontend`, and via `rake frontend:build` in the
      # test/coverage legs) reuses tarballs instead of re-fetching them each run.
      # Best-effort by design: actions/cache warns and continues on a restore
      # miss or a save failure, so this step can never fail the job. Keyed on the
      # frontend lockfile; the shared key is intentional so every matrix leg and
      # job reuses one cache.
      - name: cache bun install cache
        if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: build dashboard SPA
        if: env.RUN == 'true'
        run: bundle exec rake frontend:build
      - name: dummy app setup
        if: env.RUN == 'true'
        run: |
          cd test/dummy
          bundle install
          bin/rails db:prepare
      - name: rake test
        if: env.RUN == 'true'
        run: bundle exec rake test

  # Oracle suite lifted from upstream Sidekiq (SHA-pinned in
  # test/parity/.sidekiq_sha). Its own dedicated job so a parity divergence is
  # legible at a glance, separate from the version matrix. Pin RAILS_VERSION so
  # it tests a matrix Rails line rather than floating to newest.
  parity:
    name: parity (oracle)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      RAILS_VERSION: "8.0"
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: rails-8.0
      - name: rake test:parity
        run: bundle exec rake test:parity

  # Blocking line + branch coverage gates (both >= 90%) on lib/. The Cobertura
  # report is still uploaded for per-file inspection. Pin RAILS_VERSION so the
  # gated numbers stay deterministic.
  coverage:
    name: coverage (line + branch >= 90%)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      RAILS_VERSION: "8.0"
      REDIS_URL: redis://localhost:6379/0
      COVERAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          cache-version: rails-8.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # Cache Bun's global download cache so `bun install --frozen-lockfile`
      # (run here directly in `frontend`, and via `rake frontend:build` in the
      # test/coverage legs) reuses tarballs instead of re-fetching them each run.
      # Best-effort by design: actions/cache warns and continues on a restore
      # miss or a save failure, so this step can never fail the job. Keyed on the
      # frontend lockfile; the shared key is intentional so every matrix leg and
      # job reuses one cache.
      - name: cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: build dashboard SPA
        run: bundle exec rake frontend:build
      - name: dummy app setup
        run: |
          cd test/dummy
          bundle install
          bin/rails db:prepare
      - name: coverage gate
        run: bundle exec rake test:coverage
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/coverage.xml
          if-no-files-found: warn

  # Guard against deleted/truncated spec docs (the authoritative oracles for
  # parity). This is a quick, standalone check that doesn't require Redis or Ruby.
  spec-docs:
    name: spec docs (exist + non-empty)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.specdocs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check spec docs
        run: |
          for file in docs/target/sidekiq-free.md docs/target/sidekiq-pro.md docs/target/sidekiq-ent.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file does not exist"
              exit 1
            fi
            if [ ! -s "$file" ]; then
              echo "ERROR: $file is empty"
              exit 1
            fi
            echo "✓ $file exists and is non-empty ($(wc -l < "$file") lines)"
          done

  # The matrix `test` and `coverage` jobs only *build* the SPA (tsc + vite) via
  # `rake frontend:build`; hand-written frontend types can typecheck clean yet
  # null-render at runtime (#272), so the build alone is not a regression gate.
  # This dedicated Node-only job runs the dashboard's Vitest suite on every PR
  # (no Ruby/Redis needed; the suite is fast). Closes #273.
  frontend:
    name: frontend (vitest)
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.frontend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      # Cache Bun's global download cache so `bun install --frozen-lockfile`
      # (run here directly in `frontend`, and via `rake frontend:build` in the
      # test/coverage legs) reuses tarballs instead of re-fetching them each run.
      # Best-effort by design: actions/cache warns and continues on a restore
      # miss or a save failure, so this step can never fail the job. Keyed on the
      # frontend lockfile; the shared key is intentional so every matrix leg and
      # job reuses one cache.
      - name: cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: install dashboard deps
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: vitest
        run: bun run test
        working-directory: frontend
