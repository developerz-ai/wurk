name: bench vs sidekiq

# The COMPARISON against stock Sidekiq (CLAUDE.md pillar 3; plan 101/12 T4),
# as opposed to bench.yml's regression check of wurk against its own base.
# Advisory: nightly plus manual dispatch, never on a pull request, never a
# required check, and nothing reads its result but a person. It runs both
# topologies docs/benchmarks.md publishes on one hosted runner and uploads the
# tables and raw JSON. A hosted runner is shared hardware, so one night's ratio
# is a sample, not a result: docs/benchmarks.md publishes paired medians across
# many runs, and nothing here updates that doc.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vs-sidekiq:
    name: wurk vs stock sidekiq
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4
        ports: ["6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
          --health-start-period 1s
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      # Shares the bundle cache test.yml's jobs populate (cache-version rails-8.1).
      RAILS_VERSION: "8.1"
      # Per-step gate, as in soak.yml: forks get a run that reports and does nothing.
      RUN: ${{ github.repository == 'developerz-ai/wurk' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      - name: resolve redis port
        if: env.RUN == 'true'
        run: echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}/0" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: env.RUN == 'true'
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: rails-8.1
      - name: one process x 5 threads
        if: env.RUN == 'true'
        env:
          WURK_BENCH_VS_JSON: tmp/vs-sidekiq/one-process.json
        run: |
          set -o pipefail
          mkdir -p tmp/vs-sidekiq
          bundle exec rake bench:vs_sidekiq | tee tmp/vs-sidekiq/one-process.md
      - name: swarm of 4 vs 4 sidekiq processes
        if: env.RUN == 'true'
        env:
          WURK_BENCH_VS_PROCESSES: "4"
          WURK_BENCH_VS_JSON: tmp/vs-sidekiq/four-processes.json
        run: |
          set -o pipefail
          bundle exec rake bench:vs_sidekiq | tee tmp/vs-sidekiq/four-processes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.RUN == 'true'
        with:
          name: vs-sidekiq-${{ github.run_id }}
          path: |
            tmp/vs-sidekiq/
            tmp/vs_sidekiq-*.log
          if-no-files-found: warn
          retention-days: 30
