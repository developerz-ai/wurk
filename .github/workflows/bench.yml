name: bench

# The `rake bench` regression gate (CLAUDE.md pillar 3): did THIS PR slow wurk
# down versus its own base? It says nothing about stock Sidekiq — that is
# `rake bench:vs_sidekiq`, which takes minutes per shape and never gates.
#
# Deleted in #296 for cost, restored here in a cheaper shape. The old workflow
# ran the suite 7x across TWO large-runner jobs and duplicated it on every
# push to main. This is one PR-only job that runs it 6x (best-of-3 per side) and
# only when a bench input actually moved. Best-of-N is exactly what keeps the
# noisiest benches from false-positiving the gate (#250): `wurk swarm boot`
# reports +/-24% run to run. Six full runs at the scripts' own ips windows took
# 6.2 min of a 6.6 min job. The WURK_BENCH_MAX_* window caps (bench/support.rb)
# are NOT applied here: run_side runs each revision's own scripts, and a base
# revision predating the caps would keep its longer windows — unequal error
# bars widen the comparator's cutoff and could hide a >5% regression.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `rake bench` measures Ruby throughput only, so only Ruby/bench inputs can
  # move it. Gate the bench job on those paths so docs-, frontend- and test-only
  # PRs never spin a bench runner. A JOB-level `if` is correct here, unlike the
  # step-level gate test.yml uses: bench is deliberately not a required check, so
  # "skipped" is an honest answer. If it ever becomes required, switch it to
  # test.yml's per-step RUN pattern first — GitHub counts a skipped required
  # check as passing (#469).
  #
  # Gemfile.lock is deliberately absent from the filter — it is gitignored
  # (.gitignore:5) and can never appear in a diff; `Gemfile` and the gemspec are
  # what actually move dependencies.
  #
  # Hosted `ubuntu-latest` is noisy shared hardware — hence the interleaved
  # best-of-N below rather than a single sample per side.
  detect:
    name: detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            bench:
              - 'lib/**'
              - 'exe/**'
              - 'bench/**'
              - 'bin/bench-compare'
              - 'Rakefile'
              - 'Gemfile'
              - '*.gemspec'
              - '.github/workflows/bench.yml'

  compare:
    name: bench vs base
    needs: detect
    if: needs.detect.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # sticky delta comment
    services:
      redis:
        image: redis:7.4
        # Container port only — Docker binds a free host port. See test.yml.
        ports: ["6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
          --health-start-period 1s
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      # Pinned so a floating Rails resolve can't perturb the numbers, and so this
      # job reuses the gem cache that test.yml's `test` job already populates
      # (cache-version: rails-8.1 in both).
      RAILS_VERSION: "8.1"
      BENCH_RUNS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base run checks out base.sha, which shallow lacks
          persist-credentials: false
      # STEP, not job-level `env:` — see test.yml. Both sides of the comparison
      # sample this one runner, so both read the same resolved port.
      - name: resolve redis port
        run: echo "REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}/0" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: rails-8.1
      # The base checkouts below rewind the working tree. Keep the PR's
      # comparator so the gate rule under review is the one that runs.
      - name: stage comparator
        run: cp bin/bench-compare /tmp/bench-compare
      # Interleaved, not batched per side — the two sides have to sample the
      # same runner, and a runner is not the same machine minute to minute. It
      # is coldest and most contended right after the cache restore and settles
      # later, so N head samples in the job's first window against N base
      # samples in its second measures the windows, not the diff.
      #
      # #391 failed exactly that way: every Redis-touching bench read 2-24%
      # "slower" on head with error bars 2-4x wider than base's, while both
      # allocation benches (no Redis, deterministic) matched to the digit — on a
      # branch whose entire enqueue path is byte-identical to base.
      #
      # So one round is one head sample plus one base sample, back to back, and
      # the within-round order flips each round so neither side permanently owns
      # the colder first slot. Best-of-N (bin/bench-compare keeps each label's
      # fastest run, symmetrically, so it cannot hide a real regression) then
      # damps what is left: a contended window costs each side one sample rather
      # than every sample that side has.
      - name: bench head vs base, interleaved
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A silently-crashed run is the dangerous one: an empty baseline makes
          # bin/bench-compare report "no comparable benchmarks" and exit 0,
          # gating on nothing. `-e` plus pipefail (`| tee` must not swallow a
          # crashed bench run) fails the job loudly instead.
          set -eo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          : > /tmp/bench-head.txt
          : > /tmp/bench-base.txt

          # $1 = side (head|base), $2 = round. Reinstalls on every switch: the
          # two sides may resolve different gems, and the lockfile is not
          # committed to tell us whether this one does.
          run_side() {
            case "$1" in
              head) sha=$HEAD_SHA ;;
              base) sha=$BASE_SHA ;;
            esac
            echo "::group::bench $1 run $2"
            git checkout --quiet "$sha"
            bundle install --quiet
            bundle exec rake bench | tee -a "/tmp/bench-$1.txt"
            echo "::endgroup::"
          }

          for i in $(seq 1 "$BENCH_RUNS"); do
            if [ $((i % 2)) -eq 1 ]; then
              run_side head "$i"
              run_side base "$i"
            else
              run_side base "$i"
              run_side head "$i"
            fi
          done
      # Gate rule lives in bin/bench-compare (its noise band, `fail_gate` and
      # final `exit`) — this step only transports its verdict.
      - name: compare, comment, gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          code=0
          /tmp/bench-compare /tmp/bench-base.txt /tmp/bench-head.txt > /tmp/bench-comment.md || code=$?
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/bench-comment.md

          # Sticky comment: bin/bench-compare prints its MARKER as the first
          # line, so a prior comment is matched by prefix and edited in place
          # instead of stacking one per push.
          #
          # Best-effort past this point. A PR from a fork gets a read-only token
          # and the comment API 403s there; the gate verdict must not be masked
          # by a comment we were never allowed to post. The table is already in
          # the log and the job summary above.
          set +e
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- bench-compare -->")) | .id' > /tmp/bench-comment-ids.txt
          existing=$(head -n1 /tmp/bench-comment-ids.txt)
          if [ -n "$existing" ]; then
            method=PATCH
            endpoint="repos/$REPO/issues/comments/$existing"
          else
            method=POST
            endpoint="repos/$REPO/issues/$PR/comments"
          fi
          gh api -X "$method" "$endpoint" -F body=@/tmp/bench-comment.md > /dev/null ||
            echo "::warning::could not post the bench comment; the delta is in the job summary"
          exit $code
