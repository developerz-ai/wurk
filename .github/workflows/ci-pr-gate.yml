name: ci-pr-gate

# WHY THIS EXISTS — do not delete as "pointless".
#
# test.yml path-filters every job (dorny/paths-filter feeds job-level `if:`
# conditions), so on a docs-only pull request every job reports "skipped" and
# the PR head carries NO successful check. The agent-pipeline merge gate is
# fail-closed on a head with no successful check, which means such a PR could
# never merge at all.
#
# This workflow is the floor: it triggers on EVERY pull request — no paths
# filter, no paths-ignore, no job-level `if:` — does nothing but a checkout
# and a trivial assertion, and always succeeds. Its entire value is that it
# exists, guaranteeing every PR head at least one green check. Keep it cheap:
# no tests, no installs, no builds.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: assert checkout
        run: |
          test -f README.md
          echo "pr-gate ok: ${GITHUB_SHA} now carries at least one successful check"
