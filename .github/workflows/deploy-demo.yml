name: deploy-demo

# Deploy of the public demo (wurk.demo.developerz.ai) — run it by hand, or let
# release.yml call it after publishing the gem for a `lib/wurk/version.rb` bump
# landing on main (the tag is an output there, cut last).
#
# DEPLOY MODEL: this workflow only BUILDS + PUSHES the image. Infra deploys it
# via the in-cluster ArgoCD Image Updater, which selects the newest DOCR tag
# matching `^sha-[0-9a-f]{7}$` (newest-build strategy, infrastructure#232) and
# syncs automatically — CI holds NO cluster credentials (infra repo rule).
# There is no ArgoCD step here, and no ARGOCD_* secrets.
#
# WHO CAN RUN IT — three layers, only-the-org by construction:
#   1. workflow_dispatch on a PUBLIC repo can only be triggered by users with
#      *write* access (org members) — external forks/users cannot.
#   2. the `authorize` job rejects anyone not in the DEMO_DEPLOYERS repo
#      variable (comma-separated GitHub usernames). This guards the
#      workflow_dispatch door only — release.yml passes `trusted: true` and is
#      exempt, because it has already published this commit's gem. See the job.
#   3. the `build` job targets the protected `demo` environment — add Required
#      Reviewers there so the build (which produces the deploy-triggering image
#      digest) waits for a named approver. The gate sits on `build` precisely
#      because the digest push IS the deploy trigger under Image Updater.
# See docs/demo-deploy.md for the one-time setup and the infra requirements.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch / tag / SHA) to build and push (Image Updater deploys it)
        required: false
        default: main
  # release.yml calls this after a successful publish so a new gem version
  # reaches the demo without a second manual step. `build` still enters the
  # protected `demo` environment; the actor allowlist is waived via `trusted`
  # (see the authorize job for why).
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch / tag / SHA) to build and push
        required: false
        default: main
        type: string
      trusted:
        description: >-
          Set by release.yml only. Waives the DEMO_DEPLOYERS actor check —
          the caller has already published this commit's gem to RubyGems.
        required: false
        default: false
        type: boolean

# Hardcoded group: under workflow_call `github.workflow` is the CALLER's name,
# which put this job in the caller's own group — GitHub detects that as a
# deadlock and cancels the run. A fixed name also serializes every demo deploy,
# so two builds can't race pushing the tags Image Updater selects from.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

# Least privilege at the workflow level; the build job opts into packages:write.
permissions:
  contents: read

env:
  # DOCR is the deploy-critical registry: infra's Image Updater watches
  # `registry.digitalocean.com/developerz-ai/wurk-demo` and the demo's
  # kustomization rewrites the manifests' ghcr.io ref onto it (infra #803 —
  # moved off GHCR 2026-07-12 when a dead org token broke fresh pulls). GHCR
  # stays a mirror so the manifests' literal image ref keeps resolving.
  IMAGE: registry.digitalocean.com/developerz-ai/wurk-demo
  MIRROR: ghcr.io/developerz-ai/wurk-demo

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The allowlist guards the workflow_dispatch door: it stops someone with
      # write access from hand-deploying an arbitrary ref to the public demo.
      #
      # It is NOT applicable on the release path, and enforcing it there is
      # actively harmful. By the time release.yml calls us, the gem built from
      # this exact commit is already published to RubyGems — an irreversible act
      # strictly more consequential than putting the same commit on the demo. So
      # the check protects nothing here, while failing it strands the release at
      # its worst possible point: gem live, demo stale, run red. That is exactly
      # what would happen once the developerz.ai bot merges the release PRs,
      # since `github.actor` is then the bot rather than a listed human.
      #
      # The waiver is pinned to the one caller it is meant for. `trusted` is a
      # workflow_call input only (never workflow_dispatch), and on top of that we
      # require the caller to BE release.yml running on main: under workflow_call
      # `github.workflow` resolves to the CALLER's name — the same quirk that
      # forced the hardcoded concurrency group above — so it identifies the
      # caller, and the ref check means that caller's definition is a file that
      # reached main through branch protection.
      - name: Verify actor is an approved deployer
        env:
          ALLOW: ${{ vars.DEMO_DEPLOYERS }}
          ACTOR: ${{ github.actor }}
          TRUSTED: ${{ inputs.trusted }}
          CALLER: ${{ github.workflow }}
        run: |
          if [ "$TRUSTED" = "true" ]; then
            if [ "$CALLER" = "release" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "Called by the release lane on main, which already published this commit's gem — actor allowlist does not apply."
              exit 0
            fi
            echo "::error::trusted:true is only honoured from the release workflow on main (caller=$CALLER ref=$GITHUB_REF)."
            exit 1
          fi
          if [ -z "$ALLOW" ]; then
            echo "::error::DEMO_DEPLOYERS repo variable is not set — refusing to deploy."
            exit 1
          fi
          if echo "$ALLOW" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -qx "$ACTOR"; then
            echo "$ACTOR is an approved deployer."
          else
            echo "::error::$ACTOR is not in DEMO_DEPLOYERS."
            exit 1
          fi

  build:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The required-reviewer gate lives here: under the Image Updater model the
    # pushed digest is the deploy trigger, so approval must pause the run BEFORE
    # the image ships, not after.
    environment:
      name: demo
      url: https://wurk.demo.developerz.ai
    permissions:
      contents: read
      packages: write # push the demo image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # github.sha is the SHA of the ref the WORKFLOW was loaded from (the
      # default branch on a dispatch), not of `inputs.ref` — tagging with it
      # mislabels the image whenever the two differ, e.g. deploying a tag.
      #
      # `short` is the deploy-critical one. Infra's Image Updater selects by
      # `allow-tags: regexp:^sha-[0-9a-f]{7}$` (the fleet convention adopted in
      # infrastructure#232 — immutable tags, because `latest` moves under you
      # and a digest can be re-pushed). Nothing here matched that pattern, so
      # Image Updater had no candidate and the demo sat on an old digest across
      # several releases. Keep this format in lockstep with
      # stacks/apps/wurk-demo/application.yml in the infrastructure repo.
      - name: resolve built commit
        id: built
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "short=sha-$(printf '%.7s' "$sha")"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # Not github.actor: the token is what authenticates, and pinning the
          # username to the owner keeps the login independent of who triggered
          # the run (a bot merging a release PR is an actor like any other).
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.built.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.built.outputs.sha }}
            ${{ env.IMAGE }}:latest
            ${{ env.MIRROR }}:${{ steps.built.outputs.short }}
            ${{ env.MIRROR }}:${{ steps.built.outputs.sha }}
            ${{ env.MIRROR }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prune old wurk-demo images so GHCR storage doesn't grow unbounded — each
      # deploy pushes a fresh digest (tagged :sha + :latest) and every prior
      # build keeps its :sha tag forever otherwise. Keep the newest few (current
      # + a rollback window; the Image Updater serves the demo by digest, and the
      # newest version is the one :latest points at, so it is always retained).
      # Non-blocking: a cleanup hiccup (e.g. GITHUB_TOKEN lacking package-delete
      # on the org package — then provision a PAT) must never fail a deploy.
      - name: prune old GHCR images
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          owner: developerz-ai
          package-name: wurk-demo
          package-type: container
          min-versions-to-keep: 5
          token: ${{ secrets.GITHUB_TOKEN }}

      # Guard against a "successful but destructive" prune. min-versions-to-keep
      # is version-based, not digest-aware, so it can orphan a child manifest
      # still referenced by a tag we meant to keep — a failure continue-on-error
      # above would silently hide. imagetools inspect resolves the full manifest
      # (and children) from GHCR without pulling layers, so this fails the run
      # loudly if the deploy-critical :latest or the just-pushed :sha stopped
      # resolving. Not continue-on-error: a broken :latest breaks the Image
      # Updater deploy, so it must surface. DOCR is checked first and for the
      # same reason — it is the registry Image Updater actually watches.
      - name: verify retained images still resolve
        env:
          SHA: ${{ steps.built.outputs.sha }}
          SHORT: ${{ steps.built.outputs.short }}
        run: |
          for ref in "${IMAGE}:${SHORT}" "${IMAGE}:latest" "${IMAGE}:${SHA}" \
                     "${MIRROR}:${SHORT}" "${MIRROR}:latest" "${MIRROR}:${SHA}"; do
            echo "==> inspecting $ref"
            docker buildx imagetools inspect "$ref" >/dev/null
          done
