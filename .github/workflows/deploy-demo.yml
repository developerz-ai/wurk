name: deploy-demo

# Manual-only deploy of the public demo (wurk.demo.developerz.ai).
#
# DEPLOY MODEL: this workflow only BUILDS + PUSHES the image. Infra deploys it
# via the in-cluster ArgoCD Image Updater, which watches the GHCR `:latest` tag
# (digest strategy) and syncs automatically — CI holds NO cluster credentials
# (infra repo rule). There is no ArgoCD step here, and no ARGOCD_* secrets.
#
# WHO CAN RUN IT — three layers, only-the-org by construction:
#   1. workflow_dispatch on a PUBLIC repo can only be triggered by users with
#      *write* access (org members) — external forks/users cannot.
#   2. the `authorize` job rejects anyone not in the DEMO_DEPLOYERS repo
#      variable (comma-separated GitHub usernames).
#   3. the `build` job targets the protected `demo` environment — add Required
#      Reviewers there so the build (which produces the deploy-triggering image
#      digest) waits for a named approver. The gate sits on `build` precisely
#      because the digest push IS the deploy trigger under Image Updater.
# See docs/demo-deploy.md for the one-time setup and the infra requirements.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch / tag / SHA) to build and push (Image Updater deploys it)
        required: false
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level; the build job opts into packages:write.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/developerz-ai/wurk-demo

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify actor is an approved deployer
        env:
          ALLOW: ${{ vars.DEMO_DEPLOYERS }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$ALLOW" ]; then
            echo "::error::DEMO_DEPLOYERS repo variable is not set — refusing to deploy."
            exit 1
          fi
          if echo "$ALLOW" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -qx "$ACTOR"; then
            echo "$ACTOR is an approved deployer."
          else
            echo "::error::$ACTOR is not in DEMO_DEPLOYERS."
            exit 1
          fi

  build:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The required-reviewer gate lives here: under the Image Updater model the
    # pushed digest is the deploy trigger, so approval must pause the run BEFORE
    # the image ships, not after.
    environment:
      name: demo
      url: https://wurk.demo.developerz.ai
    permissions:
      contents: read
      packages: write # push the demo image to GHCR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prune old wurk-demo images so GHCR storage doesn't grow unbounded — each
      # deploy pushes a fresh digest (tagged :sha + :latest) and every prior
      # build keeps its :sha tag forever otherwise. Keep the newest few (current
      # + a rollback window; the Image Updater serves the demo by digest, and the
      # newest version is the one :latest points at, so it is always retained).
      # Non-blocking: a cleanup hiccup (e.g. GITHUB_TOKEN lacking package-delete
      # on the org package — then provision a PAT) must never fail a deploy.
      - name: prune old GHCR images
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          owner: developerz-ai
          package-name: wurk-demo
          package-type: container
          min-versions-to-keep: 5
          token: ${{ secrets.GITHUB_TOKEN }}

      # Guard against a "successful but destructive" prune. min-versions-to-keep
      # is version-based, not digest-aware, so it can orphan a child manifest
      # still referenced by a tag we meant to keep — a failure continue-on-error
      # above would silently hide. imagetools inspect resolves the full manifest
      # (and children) from GHCR without pulling layers, so this fails the run
      # loudly if the deploy-critical :latest or the just-pushed :sha stopped
      # resolving. Not continue-on-error: a broken :latest breaks the Image
      # Updater deploy, so it must surface.
      - name: verify retained images still resolve
        run: |
          for ref in "${IMAGE}:latest" "${IMAGE}:${{ github.sha }}"; do
            echo "==> inspecting $ref"
            docker buildx imagetools inspect "$ref" >/dev/null
          done
