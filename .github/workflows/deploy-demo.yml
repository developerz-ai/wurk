name: deploy-demo

# Deploy of the public demo (wurk.demo.developerz.ai) — automatic on every
# push to main that changes what the image runs, called by release.yml after
# publishing a gem, or run by hand.
#
# DEPLOY MODEL: this workflow only BUILDS + PUSHES the image. Infra deploys it
# via the in-cluster ArgoCD Image Updater, which selects the newest DOCR tag
# matching `^sha-[0-9a-f]{7}$` (newest-build strategy, infrastructure#232) and
# syncs automatically — CI holds NO cluster credentials (infra repo rule).
# There is no ArgoCD step here, and no ARGOCD_* secrets.
#
# After the push, the workflow RECORDS the deploy as a GitHub Deployment
# object (environment `demo`, ref = the built commit) and waits, bounded, for
# the demo to report the new version at /wurk/api/meta. The served version is
# the GEM version (::Wurk::VERSION), not a commit SHA — the demo app serves the
# path-sourced gem bundled by demo/Gemfile.lock, so /wurk/api/meta is the
# public witness of what is live. The expected version is read from that lock:
# the image installs the demo bundle frozen, so the checkout's
# lib/wurk/version.rb is not necessarily the version the image serves. The
# Deployment object records that wait's outcome; it triggers nothing.
#
# WHO CAN RUN IT — two layers in force, a third available but not configured:
#   1. workflow_dispatch on a PUBLIC repo can only be triggered by users with
#      *write* access (org members) — external forks/users cannot.
#   2. the `authorize` job rejects anyone not in the DEMO_DEPLOYERS repo
#      variable (comma-separated GitHub usernames). This guards the
#      workflow_dispatch door only — a push to main and release.yml (`trusted:
#      true`) are exempt: both deploy a commit that passed branch protection.
#   3. the `build` job targets the `demo` environment. NOT A GATE TODAY: the
#      environment carries no protection rules (`gh api
#      repos/developerz-ai/wurk/environments/demo` → `protection_rules: []`), so
#      nothing waits for an approver. Adding Required Reviewers there would make
#      the build (which produces the deploy-triggering image digest) wait for
#      one; the environment sits on `build` precisely because the digest push
#      IS the deploy trigger under Image Updater.
# See docs/demo-deploy.md for the one-time setup and the infra requirements.

on:
  # Main already passed branch protection, so the demo tracks it continuously.
  # The version file is excluded because release.yml deploys that commit itself
  # once the gem is published.
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - '!lib/wurk/version.rb'
      - 'app/**'
      - 'config/**'
      - 'exe/**'
      - 'frontend/**'
      - 'demo/**'
      - 'Dockerfile'
      - 'bin/demo-entrypoint'
      - 'wurk.gemspec'
      - 'Gemfile'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch / tag / SHA) to build and push (Image Updater deploys it)
        required: false
        default: main
  # release.yml calls this after a successful publish so a new gem version
  # reaches the demo without a second manual step. `build` still enters the
  # `demo` environment (no protection rules today, see the header); the actor
  # allowlist is waived via `trusted` (see the authorize job for why).
  workflow_call:
    inputs:
      ref:
        description: Git ref (branch / tag / SHA) to build and push
        required: false
        default: main
        type: string
      trusted:
        description: >-
          Set by release.yml only. Waives the DEMO_DEPLOYERS actor check —
          the caller has already published this commit's gem to RubyGems.
        required: false
        default: false
        type: boolean

# Hardcoded group: under workflow_call `github.workflow` is the CALLER's name,
# which put this job in the caller's own group — GitHub detects that as a
# deadlock and cancels the run. A fixed name also serializes every demo deploy,
# so two builds can't race pushing the tags Image Updater selects from.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The only registry: infra's Image Updater watches this repository (infra
  # #803 moved the demo off GHCR on 2026-07-12), and the demo's kustomization
  # rewrites every image ref onto it.
  IMAGE: registry.digitalocean.com/developerz-ai/wurk-demo

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The allowlist guards the workflow_dispatch door: it stops someone with
      # write access from hand-deploying an arbitrary ref to the public demo.
      #
      # It is NOT applicable on the release path, and enforcing it there is
      # actively harmful. By the time release.yml calls us, the gem built from
      # this exact commit is already published to RubyGems — an irreversible act
      # strictly more consequential than putting the same commit on the demo. So
      # the check protects nothing here, while failing it strands the release at
      # its worst possible point: gem live, demo stale, run red. That is exactly
      # what would happen once the developerz.ai bot merges the release PRs,
      # since `github.actor` is then the bot rather than a listed human.
      #
      # The waiver is pinned to the one caller it is meant for. `trusted` is a
      # workflow_call input only (never workflow_dispatch), and on top of that we
      # require the caller to BE release.yml running on main: under workflow_call
      # `github.workflow` resolves to the CALLER's name — the same quirk that
      # forced the hardcoded concurrency group above — so it identifies the
      # caller, and the ref check means that caller's definition is a file that
      # reached main through branch protection.
      - name: Verify actor is an approved deployer
        env:
          ALLOW: ${{ vars.DEMO_DEPLOYERS }}
          ACTOR: ${{ github.actor }}
          TRUSTED: ${{ inputs.trusted }}
          CALLER: ${{ github.workflow }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Push to main (passed branch protection) — actor allowlist does not apply."
            exit 0
          fi
          if [ "$TRUSTED" = "true" ]; then
            if [ "$CALLER" = "release" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "Called by the release lane on main, which already published this commit's gem — actor allowlist does not apply."
              exit 0
            fi
            echo "::error::trusted:true is only honoured from the release workflow on main (caller=$CALLER ref=$GITHUB_REF)."
            exit 1
          fi
          if [ -z "$ALLOW" ]; then
            echo "::error::DEMO_DEPLOYERS repo variable is not set — refusing to deploy."
            exit 1
          fi
          if echo "$ALLOW" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -qx "$ACTOR"; then
            echo "$ACTOR is an approved deployer."
          else
            echo "::error::$ACTOR is not in DEMO_DEPLOYERS."
            exit 1
          fi

  build:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Where a required-reviewer gate would live (none is configured today):
    # under the Image Updater model the pushed digest is the deploy trigger, so
    # approval must pause the run BEFORE the image ships, not after.
    environment:
      name: demo
      url: https://wurk.demo.developerz.ai
    # `deployments: write` records the deploy as a GitHub Deployment object so
    # `gh api repos/{owner}/{repo}/deployments` shows a `demo` deployment at
    # the built commit — the record the demo environment's deployments tab
    # reads. Nothing else is needed: the job pushes no code, opens no PR and
    # must not hold `actions: write` or `id-token: write`.
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # github.sha is the SHA of the ref the WORKFLOW was loaded from (the
      # default branch on a dispatch), not of `inputs.ref` — tagging with it
      # mislabels the image whenever the two differ, e.g. deploying a tag.
      #
      # `short` is the deploy-critical one. Infra's Image Updater selects by
      # `allow-tags: regexp:^sha-[0-9a-f]{7}$` (the fleet convention adopted in
      # infrastructure#232 — immutable tags, because `latest` moves under you
      # and a digest can be re-pushed). Nothing here matched that pattern, so
      # Image Updater had no candidate and the demo sat on an old digest across
      # several releases. Keep this format in lockstep with
      # stacks/apps/wurk-demo/application.yml in the infrastructure repo.
      - name: resolve built commit
        id: built
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "short=sha-$(printf '%.7s' "$sha")"
          } >> "$GITHUB_OUTPUT"

      # The demo serves the GEM version, not a commit SHA: /wurk/api/meta
      # renders `::Wurk::VERSION` from the path-sourced Wurk gem bundled by
      # the image. The Dockerfile installs demo/Gemfile.lock frozen, so the
      # version the image actually bundles is the lock's `wurk (...)` entry —
      # not necessarily the checkout's lib/wurk/version.rb, which may differ
      # on an ordinary push without a version bump.
      - name: resolve demo version
        id: demo_version
        run: |
          version="$(ruby -e 'lock = File.read("demo/Gemfile.lock"); print lock[/^    wurk \(([^)]+)\)$/, 1]')"
          if [ -z "$version" ]; then
            echo "::error::demo/Gemfile.lock has no path-sourced wurk version — cannot resolve the version the built demo image bundles."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.built.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.built.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Resolve each pushed tag's manifest from DOCR (no layer pull): a tag that
      # does not resolve leaves Image Updater without a candidate, and the demo
      # freezes silently on its current digest.
      - name: verify pushed tags resolve
        env:
          SHA: ${{ steps.built.outputs.sha }}
          SHORT: ${{ steps.built.outputs.short }}
        run: |
          for ref in "${IMAGE}:${SHORT}" "${IMAGE}:latest" "${IMAGE}:${SHA}"; do
            echo "==> inspecting $ref"
            docker buildx imagetools inspect "$ref" >/dev/null
          done

      # The GitHub Deployment record: environment `demo`, ref = the built
      # commit. The pushed digest is what ACTUALLY deploys (infra's Image
      # Updater), so this object records the intent and its outcome rather
      # than triggering anything.
      #
      # `gh api` is used rather than a third-party action: this repo pins
      # every action by commit SHA and has no deployment action available.
      - name: create deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.built.outputs.sha }}
        run: |
          set -euo pipefail
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" \
            -f ref="${SHA}" \
            -f environment=demo \
            -F auto_merge=false)"
          deployment_id="$(printf '%s' "$response" | ruby -rjson -e 'print JSON.parse(STDIN.read).fetch("id")')"
          echo "id=${deployment_id}" >> "$GITHUB_OUTPUT"
          echo "Deployment ${deployment_id} created for demo at ${SHA}."

      - name: mark deployment in progress
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=in_progress \
            -f description="waiting for the demo to report the new version"

      # The bounded wait. The demo only starts serving the new version once
      # Image Updater has synced the new digest, which is asynchronous — so
      # the version is polled until it matches, with an explicit upper bound
      # on the number of attempts. An unbounded loop would hang the job
      # until the job timeout killed it, with no status recorded.
      #
      # Each request is deadline-bounded too. A demo that accepts the TCP
      # connection but stalls the response would otherwise block curl until
      # the JOB timeout killed the step — which runs after `mark deployment
      # in progress`, leaving the Deployment in_progress with no failure
      # status and no last-version diagnostic. --connect-timeout bounds the
      # handshake, --max-time the whole request, so an attempt costs at most
      # 5s of request + 10s of sleep and the loop's worst case is
      # 40 × 15s = 10 minutes even when the demo hangs on every try (a
      # responsive demo polls for ~7 minutes).
      #
      # The bound must fit inside the job's `timeout-minutes: 30` alongside
      # the image build and push, so it is deliberately short: Image Updater
      # syncs within a couple of minutes, and a demo that has not caught up
      # in 10 minutes is a real failure worth reporting, not a slow success.
      - name: wait for the demo to report the new version
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          VERSION: ${{ steps.demo_version.outputs.version }}
        run: |
          set -euo pipefail
          last_version="(none)"
          matched=""
          for attempt in $(seq 1 40); do
            body="$(curl -fsS --connect-timeout 2 --max-time 5 https://wurk.demo.developerz.ai/wurk/api/meta 2>/dev/null || true)"
            # A rollout can answer with HTML or an empty body for a moment, and
            # a JSON parse error must not abort the probe — it must read as
            # "no version yet" and retry.
            seen="$(printf '%s' "$body" | ruby -rjson -e 'begin; print JSON.parse(STDIN.read)["version"]; rescue StandardError; print ""; end' 2>/dev/null || true)"
            if [ -n "$seen" ]; then
              last_version="$seen"
              echo "attempt ${attempt}: demo reports version ${last_version} (expected ${VERSION})"
              if [ "$last_version" = "${VERSION}" ]; then
                matched=1
                break
              fi
            else
              echo "attempt ${attempt}: /wurk/api/meta did not report a version"
            fi
            sleep 10
          done

          if [ -n "$matched" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
              -f state=success \
              -f description="demo reports version ${VERSION}"
            echo "Demo reports version ${VERSION} — deployment succeeded."
            exit 0
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=failure \
            -f description="demo did not report version ${VERSION} within the wait window"
          echo "::error::demo /wurk/api/meta reports version ${last_version}, expected ${VERSION} — the demo did not pick up the new build in time."
          exit 1
