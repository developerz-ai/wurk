name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: build frontend
        run: bundle exec rake frontend:build
      - name: build & push gem
        uses: rubygems/release-gem@v1
