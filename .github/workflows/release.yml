name: release

on:
  push:
    tags: ["v*"]

# Least privilege: contents:write to cut the GitHub Release; id-token:write for
# RubyGems trusted publishing (OIDC). No long-lived GEM_HOST_API_KEY anywhere.
# packages:write is for the called deploy-demo workflow — a reusable workflow's
# job permissions are capped by the caller's, so without it the demo's GHCR
# mirror push is denied.
permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
          --health-start-period 1s
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      # Third-party actions pinned to a commit SHA — this job holds id-token and
      # publishes the gem, so a moved tag must not be able to hijack it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          # Pinned below the newest Ruby on purpose: the built .gem is pure Ruby
          # and identical whichever interpreter packs it, so this job carries the
          # risk of a new interpreter tripping a release tool with no upside.
          # The compatibility statement is made by the `test` job, not here.
          ruby-version: "3.4"
          bundler-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      # Precompile the SolidJS SPA into vendor/assets/ (bun install + vite build).
      - name: build dashboard SPA
        run: bundle exec rake frontend:build

      - name: dummy app setup
        run: |
          cd test/dummy
          bundle install
          bin/rails db:prepare

      # Gate: tag ↔ Wurk::VERSION, dashboard bundle + manifest present, CHANGELOG
      # section exists, clean tree, tests green.
      - name: release gate
        run: bundle exec rake release:check

      # Build the gem into pkg/ and assert the precompiled dashboard is *inside*
      # the .gem — consumers never run Node, so a bundle-less gem is broken.
      - name: build & verify gem
        run: bundle exec rake release:package

      # Exchange the GitHub OIDC token for a short-lived RubyGems credential.
      - name: configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: gem push
        run: |
          version="$(ruby -Ilib -e 'require "wurk/version"; print Wurk::VERSION')"
          gem push "pkg/wurk-${version}.gem"

      - name: await RubyGems propagation
        run: |
          version="$(ruby -Ilib -e 'require "wurk/version"; print Wurk::VERSION')"
          gem exec rubygems-await "pkg/wurk-${version}.gem"

      # GitHub Release: notes from the CHANGELOG section, the .gem attached.
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(ruby -Ilib -e 'require "wurk/version"; print Wurk::VERSION')"
          bin/changelog-section "$version" > "${RUNNER_TEMP}/notes.md"
          flags=(--title "wurk ${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md")
          if [ "$(ruby -e 'require "rubygems"; print Gem::Version.new(ARGV[0]).prerelease?' "$version")" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" "pkg/wurk-${version}.gem"

  # Ship the released tag to wurk.demo.developerz.ai. Runs only after the gem is
  # published, so the demo never advertises a version RubyGems does not have.
  # deploy-demo keeps both of its gates (DEMO_DEPLOYERS actor allowlist + the
  # protected `demo` environment), so this queues the deploy rather than forcing
  # it — an unapproved release still publishes the gem and just leaves the demo
  # on the previous image.
  demo:
    needs: release
    uses: ./.github/workflows/deploy-demo.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit
