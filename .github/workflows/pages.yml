name: pages

# Publishes the static marketing/docs site in docs/site/ to GitHub Pages,
# generating the YARD API docs into docs/site/api/ at build time so they ship
# alongside the landing page (and llms.txt links resolve).
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "lib/**"
      - ".yardopts"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege; the deploy job needs pages + id-token to publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Generate the YARD API docs into docs/site/api/ (per .yardopts) so the
      # upload step ships them with the static site.
      - run: bundle exec rake yard
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
