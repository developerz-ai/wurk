name: pages

# Publishes the static marketing/docs site in docs/site/ to GitHub Pages,
# generating the YARD API docs into docs/site/api/ at build time so they ship
# alongside the landing page (and llms.txt links resolve).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "lib/**"
      - ".yardopts"
      - "README.md"
      - "Rakefile"
      - "tasks/llms_full.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege; the deploy job needs pages + id-token to publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Generate the YARD API docs into docs/site/api/ (per .yardopts) and the
      # single-fetch llms-full.txt, so the upload step ships both with the site.
      - run: bundle exec rake yard docs:llms_full
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
