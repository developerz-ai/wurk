name: pages

# Publishes the static marketing/docs site in docs/site/ to GitHub Pages,
# generating the YARD API docs into docs/site/api/ at build time so they ship
# alongside the landing page (and llms.txt links resolve).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "lib/**"
      - ".yardopts"
      - "README.md"
      - "Rakefile"
      - "tasks/llms_full.rb"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege; the deploy job needs pages + id-token to publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Generate the YARD API docs into docs/site/api/ (per .yardopts) and the
      # single-fetch llms-full.txt, so the upload step ships both with the site.
      - run: bundle exec rake yard docs:llms_full
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
