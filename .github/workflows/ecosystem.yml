name: ecosystem

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # weekly

permissions:
  contents: read
  # paths-filter reads the PR's changed-file list on pull_request events.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 45 minutes of third-party suites is far too much to pay for a docs edit.
  # Gate it — but on pull requests ONLY: push-to-main keeps main verifiable, and
  # the weekly schedule has no base commit to diff against, so filtering there
  # would silently skip the run it exists for.
  detect:
    name: detect changed paths
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      ruby: ${{ steps.filter.outputs.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            ruby:
              - 'lib/**'
              - 'app/**'
              - 'exe/**'
              - 'test/**'
              - 'tasks/**'
              - 'Gemfile'
              - 'Gemfile.lock'
              - 'Rakefile'
              - '*.gemspec'
              - '.github/workflows/ecosystem.yml'

  ecosystem:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          # NOT the newest Ruby, deliberately. This job's subject is third-party
          # gems at pinned upstream SHAs, so it has to run a Ruby *they* support:
          # Ruby 4.0 dropped `benchmark` from the default gems and sidekiq-cron's
          # own test suite requires it, which fails the job on something that is
          # not about Wurk at all. Bump when the pinned suites do.
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test:ecosystem
