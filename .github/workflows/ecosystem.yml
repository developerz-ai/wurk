name: ecosystem

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # weekly
  workflow_dispatch:
    # Manual one-off for the watcher. dry_run='true' lists releases the
    # watcher would file and POSTs none — the only safe way to verify the
    # dedup + URL + body schema end-to-end before the schedule fires real
    # traffic. dry_run='false' (the default) is the real run. The watcher
    # job's `if:` is what actually restricts execution to schedule +
    # dispatch, so this input is harmless on every other trigger.
    inputs:
      dry_run:
        description: 'List releases the watcher would file without POSTing to the API.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  # paths-filter reads the PR's changed-file list on pull_request events.
  pull-requests: read
  # `detect`'s dup step reads the merged PR's workflow runs (read-only).
  # `watcher` reads the prior `wurk-watcher-state` artifact from its own
  # previous run to dedupe against already-filed upstream versions.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A running main run is never cancelled. One group, unlike test.yml, because the
  # watcher relies on it: a queued run can be replaced, and the next one covers it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Third-party suites have nothing to say about a docs edit. Gate them — but
  # on pull requests ONLY: push-to-main keeps main verifiable
  # (minus `dup` pushes, see test.yml), and the weekly schedule has no base
  # commit to diff against, so filtering there would silently skip the run it
  # exists for.
  detect:
    name: detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ruby: ${{ steps.filter.outputs.ruby }}
      dup: ${{ steps.dup.outputs.dup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Push whose tree already passed this workflow on the PR head → skip.
      - name: duplicate of an already-green PR head (dup)
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dup="$(bin/ci-dup-push .github/workflows/ecosystem.yml)"
          [ "$dup" = "true" ] || dup=false
          echo "dup=$dup" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ruby:
              - 'lib/**'
              - 'app/**'
              - 'exe/**'
              - 'test/**'
              - 'tasks/**'
              # bin/test-ecosystem is the harness driver; ecosystem/** is the
              # sidekiq shim gem every harness Gemfile resolves `sidekiq` to.
              - 'bin/**'
              - 'ecosystem/**'
              # Gemfile.lock is deliberately absent from the filter — it is
              # gitignored and can never appear in a diff; `Gemfile` and the
              # gemspec are what actually move dependencies.
              - 'Gemfile'
              - 'Rakefile'
              - '*.gemspec'
              - '.github/workflows/ecosystem.yml'

  ecosystem:
    needs: detect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Four harnesses, each cloning and installing its own bundle: ~2.5 min on a warm
    # developer box. Their suites take seconds; the installs are what a cold run pays.
    timeout-minutes: 15
    services:
      redis:
        # An empty image starts no service, so a no-op run skips the pull.
        image: ${{ (needs.detect.result != 'success' || (needs.detect.outputs.dup != 'true' && (github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true'))) && 'redis:7.4' || '' }}
        # Container port only — Docker binds a free host port. See test.yml.
        ports: ["6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      # Per-step gate, not a job-level `if:` — a skipped job reports as a
      # satisfied check. See test.yml's `test` job (#469).
      RUN: ${{ needs.detect.result != 'success' || (needs.detect.outputs.dup != 'true' && (github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      # ECOSYSTEM_REDIS_URL, not REDIS_URL: bin/test-ecosystem resolves
      # `REDIS_URL="${ECOSYSTEM_REDIS_URL:-...}"` and exports its own value to
      # every harness, so a REDIS_URL set here would be overwritten and never
      # reach them. DB index 15 is what that script already uses — this change
      # is about the port, not the namespace. STEP, not job-level `env:`, since
      # the `job` context is unavailable there.
      - name: resolve redis port
        if: env.RUN == 'true'
        run: echo "ECOSYSTEM_REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}/15" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        if: env.RUN == 'true'
        with:
          # NOT the newest Ruby, deliberately. This job's subject is third-party
          # gems at pinned upstream SHAs, so it has to run a Ruby *they* support:
          # Ruby 4.0 dropped `benchmark` from the default gems and sidekiq-cron's
          # own test suite requires it, which fails the job on something that is
          # not about Wurk at all. Bump when the pinned suites do.
          ruby-version: "3.4"
          bundler-cache: true
      - name: rake test:ecosystem
        if: env.RUN == 'true'
        run: bundle exec rake test:ecosystem

  # Watcher for upstream Sidekiq releases. Files one developerz.ai ask per
  # stable Sidekiq version newer than the `wurk-watcher-state` artifact's
  # high-water mark. Fires ONLY on `schedule` (weekly) or `workflow_dispatch`
  # (manual) — the per-job `if:` is what enforces that, not the trigger list,
  # so push and PR events are guaranteed never to invoke it.
  #
  # Upstream is read from TAGS, not GitHub Releases: sidekiq/sidekiq publishes
  # no GitHub Releases at all (`/releases` is an empty list, `/releases/latest`
  # is 404), so a releases-based watcher can never file anything.
  #
  # The body is `POST /v1/asks`'s strict schema: `ask`, `repos`, `dedupe_key`,
  # optional `evidence.urls`, and nothing else — an unknown key is a 400.
  # `dedupe_key` makes a re-filed version an idempotent `kind: "existing"`.
  watcher:
    name: sidekiq release watcher
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # DEVELOPERZ_API_KEY lives only in this environment, whose deployment
    # branch policy admits main alone: a dispatch from any other ref is refused
    # before a step runs, so no branch can read the token.
    environment: sidekiq-release-watcher
    env:
      GH_TOKEN: ${{ github.token }}
      # The secret is read into env ONLY. Every `run:` block below consumes
      # `${API_KEY}` in shell — never on a curl argv token, never echoed,
      # never logged via `set -x`. The Authorization header is sent via
      # `curl -H @-` so the literal token never appears in `ps` either.
      API_KEY: ${{ secrets.DEVELOPERZ_API_KEY }}
      # Overridable: a wrong default is a 1-line var fix, no code change.
      API_URL: ${{ vars.DEVELOPERZ_API_URL || 'https://api.developerz.ai/v1/asks' }}
      STATE_ARTIFACT: wurk-watcher-state
      # 'true' ONLY on a workflow_dispatch call that set the input to the
      # literal string 'true'. Under `schedule` the dispatch branch is false
      # and `inputs.*` is empty here, so the whole AND collapses to '' —
      # false, the real run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Belt-and-braces for the "secret unset" case. GitHub resolves an
      # absent secret to literal empty text in ${{ secrets.X }}, not to
      # '***', so a plain -z test is the only honest check. A SCHEDULED run
      # without the secret fails: it is the watcher's only trigger, and a green
      # no-op every week is a watcher nobody notices is off (the 2026-10-12,
      # -19 and -26 schedules were exactly that). A manual dispatch without it is a clean,
      # announced skip, so a dry run can still check the rest of the job.
      - name: require DEVELOPERZ_API_KEY on schedule
        env:
          API_KEY: ${{ secrets.DEVELOPERZ_API_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "${API_KEY:-}" ]; then
            if [ "${EVENT:-}" = "schedule" ]; then
              echo "::error::DEVELOPERZ_API_KEY missing — the scheduled sidekiq release watcher cannot file asks. Add the secret (and confirm DEVELOPERZ_API_URL), or remove the watcher."
              exit 1
            fi
            echo "DEVELOPERZ_API_KEY missing — watcher skipped (manual dispatch; a scheduled run fails instead)."
            exit 0
          fi

      # Read the prior marker via `gh api` rather than a separate action:
      # there's no SHA-pinned `download-artifact` step already in the repo,
      # adding one would invent a SHA, and `gh api` against the workflow's
      # own GITHUB_TOKEN already has access to its past artifacts under the
      # workflow-level `actions: read`. The artifact name is unique to
      # this job, so a name filter is sufficient — no workflow_id lookup.
      - name: read prior marker artifact
        id: read_marker
        if: env.API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ARTIFACT: ${{ env.STATE_ARTIFACT }}
        run: |
          set -euo pipefail
          mkdir -p state

          # Fail the step on a lookup error: silently treating the failure as
          # "no artifact found" would re-seed the marker and skip every
          # version released in between. `archive_url` is empty ONLY when no
          # unexpired artifact exists; an expired one cannot be downloaded,
          # so it is filtered out rather than failing the curl below.
          archive_url=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${STATE_ARTIFACT}&per_page=10" \
            --jq '.artifacts[] | select(.expired | not) | .archive_download_url' \
            | head -n1)

          if [ -n "$archive_url" ]; then
            # `archive_download_url` returns 302 to a GitHub-routed S3 URL;
            # curl -L follows it with the same Authorization header. gh api
            # historically doesn't follow external redirects cleanly here.
            curl -fsSL \
              -H "Authorization: token ${GH_TOKEN}" \
              "$archive_url" \
              > state/prior.zip
            # `actions/upload-artifact` archives sit at the zip root, so a
            # flat extract places marker.txt directly under state/.
            unzip -o -q state/prior.zip -d state/
            rm -f state/prior.zip
          fi

          if [ -s state/marker.txt ]; then
            echo "Loaded prior marker ($(wc -l < state/marker.txt) line(s))."
          else
            : > state/marker.txt
            echo "No prior marker — this run seeds it to the newest upstream version and files nothing."
          fi

      # Compute the stable versions above the marker, then file them oldest
      # first, at most MAX_ASKS per run.
      #
      # The marker is a HIGH-WATER MARK: the newest version this watcher has
      # filed (or seeded). A legacy marker holding a list of versions reads as
      # its highest. Only `vX.Y.Z` tags count; betas and rcs are skipped. A
      # backport tagged after a newer line (e.g. a 7.x patch after 8.0) sits
      # below the mark and is deliberately not filed.
      #
      # An empty or absent marker SEEDS: it is set to the newest upstream
      # version and nothing is filed, so a first run (or a lost artifact)
      # never files the whole history. A dry run only announces the seed.
      #
      # The marker advances one version at a time, after each 2xx, so a
      # failure mid-run keeps every ask already filed and the next run retries
      # the rest; `dedupe_key` makes any re-file idempotent on the API side.
      - name: list sidekiq tags and file one ask per new release
        if: env.API_KEY != ''
        env:
          API_KEY: ${{ secrets.DEVELOPERZ_API_KEY }}
          API_URL: ${{ env.API_URL }}
          DRY_RUN: ${{ env.DRY_RUN }}
          MAX_ASKS: "3"
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'

          gh api --paginate "/repos/sidekiq/sidekiq/tags?per_page=100" --jq '.[].name' \
            > /tmp/sidekiq-tags.txt
          versions=$(sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' /tmp/sidekiq-tags.txt | sort -uV)
          if [ -z "$versions" ]; then
            echo "::error::no stable vX.Y.Z tag found on sidekiq/sidekiq — refusing to treat that as 'nothing new'."
            exit 1
          fi
          latest=$(printf '%s\n' "$versions" | tail -n1)

          mkdir -p state
          touch state/marker.txt
          marker=$(sed 's/^v//; /^[[:space:]]*$/d' state/marker.txt | sort -V | tail -n1)
          if [ -n "$marker" ] && ! [[ "$marker" =~ $semver ]]; then
            echo "::error::marker '${marker}' is not an X.Y.Z version — fix or delete the ${STATE_ARTIFACT:-wurk-watcher-state} artifact."
            exit 1
          fi

          if [ -z "$marker" ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] would seed marker to ${latest}; files nothing."
            else
              printf '%s\n' "$latest" > state/marker.txt
              echo "seeded: marker set to ${latest} (no prior marker); filed nothing."
            fi
            exit 0
          fi

          # Rewrite a legacy list marker as the single high-water value.
          if [ "${DRY_RUN}" != "true" ]; then
            printf '%s\n' "$marker" > state/marker.txt
          fi

          newer=()
          while IFS= read -r v; do
            if [ "$v" = "$marker" ]; then continue; fi
            top=$(printf '%s\n%s\n' "$marker" "$v" | sort -V | tail -n1)
            if [ "$top" = "$v" ]; then newer+=("$v"); fi
          done <<<"$versions"

          echo "Marker ${marker}; newest upstream ${latest}; ${#newer[@]} newer version(s)."
          if [ "${#newer[@]}" -gt "$MAX_ASKS" ]; then
            echo "::warning::${#newer[@]} versions above the marker; filing the oldest ${MAX_ASKS} this run, the rest on later runs."
            newer=("${newer[@]:0:$MAX_ASKS}")
          fi

          resp=$(mktemp)
          filed=0
          for v in ${newer[@]+"${newer[@]}"}; do
            tag="v${v}"
            ask="Upstream Sidekiq ${tag} was released. Evaluate whether Wurk, as a 100% drop-in replacement for Sidekiq, Sidekiq Pro and Sidekiq Enterprise, needs changes to match it: read the ${v} entry in Sidekiq's Changes.md (and the Pro/Ent changelogs if that release touches them), check for any change to the Redis key schema, the job JSON format, the public Ruby API, or behaviour Wurk mirrors, and open focused issues or PRs in developerz-ai/wurk for each real gap. If nothing in this release affects Wurk, say so and close the ask."
            body=$(jq -nc \
              --arg ask "$ask" \
              --arg key "sidekiq-release:${tag}" \
              --arg changes "https://github.com/sidekiq/sidekiq/blob/${tag}/Changes.md" \
              --arg tree "https://github.com/sidekiq/sidekiq/tree/${tag}" \
              '{ask:$ask, repos:["developerz-ai/wurk"], dedupe_key:$key, evidence:{urls:[$changes,$tree]}}')

            if [ "${DRY_RUN}" = "true" ]; then
              echo "  [dry-run] would file: ${tag} (dedupe_key sidekiq-release:${tag})"
              filed=$((filed + 1))
              continue
            fi

            # Header on stdin so the token never appears in argv. No `-f`:
            # it discards the response body, which is the diagnosis. No `-v`.
            rc=0
            code=$(printf 'Authorization: Bearer %s\nContent-Type: application/json\n' "${API_KEY}" \
              | curl -sS -o "$resp" -w '%{http_code}' -X POST -H @- --data "${body}" "${API_URL}") || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::POST ${API_URL} for ${tag} failed before an HTTP answer (curl exit ${rc})."
              exit 1
            fi
            case "$code" in
              2??) ;;
              *)
                echo "::error::POST ${API_URL} for ${tag} answered HTTP ${code}; marker stays at ${marker}."
                echo "Response body:"
                head -c 4000 "$resp"
                echo
                exit 1
                ;;
            esac

            marker="$v"
            printf '%s\n' "$marker" > state/marker.txt
            filed=$((filed + 1))
            echo "  filed: ${tag} (HTTP ${code}, $(jq -r '.kind // "unknown"' "$resp" 2>/dev/null || echo unknown))"
          done

          echo "Summary: filed=${filed} marker=${marker} dry_run=${DRY_RUN:-false}."

      # Re-upload the marker whenever it was READ: a POST failure still keeps
      # the versions already filed (the marker advanced after each 2xx). Not
      # after a failed read, where state/marker.txt would be empty and the
      # next run would silently re-seed past every version in between.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.read_marker.outcome == 'success'
        with:
          name: wurk-watcher-state
          path: state/marker.txt
          if-no-files-found: warn
          # GitHub default is 90 days. Re-uploading every run keeps the
          # marker fresh indefinitely; no retention knob needed.
          retention-days: 90
