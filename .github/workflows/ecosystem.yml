name: ecosystem

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # weekly

permissions:
  contents: read
  # paths-filter reads the PR's changed-file list on pull_request events.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 45 minutes of third-party suites is far too much to pay for a docs edit.
  # Gate it — but on pull requests ONLY: push-to-main keeps main verifiable, and
  # the weekly schedule has no base commit to diff against, so filtering there
  # would silently skip the run it exists for.
  # Runner selection is a repository variable — see test.yml's `detect` for the
  # full rationale, including why the fork guard comes first.
  detect:
    name: detect changed paths
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.WURK_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      ruby: ${{ steps.filter.outputs.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ruby:
              - 'lib/**'
              - 'app/**'
              - 'exe/**'
              - 'test/**'
              - 'tasks/**'
              # Gemfile.lock is deliberately absent from the filter — it is gitignored
              # (.gitignore:5) and can never appear in a diff; `Gemfile` and the gemspec are
              # what actually move dependencies.
              - 'Gemfile'
              - 'Rakefile'
              - '*.gemspec'
              - '.github/workflows/ecosystem.yml'

  ecosystem:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.WURK_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    services:
      redis:
        image: redis:7.4
        # Container port only — Docker binds a free host port. See test.yml.
        # This job's concurrency group is per-ref, so a PR run, a push-to-main
        # run and the weekly schedule can be in flight against one host at once.
        ports: ["6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ECOSYSTEM_REDIS_URL, not REDIS_URL: bin/test-ecosystem:22 resolves
      # `REDIS_URL="${ECOSYSTEM_REDIS_URL:-...}"` and exports its own value to
      # every harness, so a REDIS_URL set here would be overwritten and never
      # reach them. DB index 15 is what that script already uses — this change
      # is about the port, not the namespace. STEP, not job-level `env:`, since
      # the `job` context is unavailable there.
      - name: resolve redis port
        run: echo "ECOSYSTEM_REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}/15" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          # NOT the newest Ruby, deliberately. This job's subject is third-party
          # gems at pinned upstream SHAs, so it has to run a Ruby *they* support:
          # Ruby 4.0 dropped `benchmark` from the default gems and sidekiq-cron's
          # own test suite requires it, which fails the job on something that is
          # not about Wurk at all. Bump when the pinned suites do.
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test:ecosystem
