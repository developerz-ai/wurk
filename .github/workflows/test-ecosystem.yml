name: test-ecosystem

# Third-party-suite CI (sidekiq-cron's own test suite against Wurk, plus
# the other pins under ecosystem/**). Ported from ecosystem.yml when
# that workflow was repurposed into a Sidekiq release watcher. Same
# triggers, same schedule, same per-step RUN gate, same path filter, same
# Ruby 3.4 (suite needs stdlib `benchmark` that 4.0 dropped), same
# ECOSYSTEM_REDIS_URL/DB 15, same bin/ci-dup-push dup-push. The suite
# was advisory/weekly either way, so the ruleset's required checks are
# unchanged.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # weekly

# Same as the old ecosystem.yml: read-only on the repo; pull-requests:
# read for the `detect` gate, actions: read for bin/ci-dup-push.
permissions:
  contents: read
  pull-requests: read
  # `detect`'s dup step reads the merged PR's workflow runs (read-only).
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main's own runs (see test.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Third-party suites have nothing to say about a docs edit. Gate them —
  # but on pull requests ONLY: push-to-main keeps main verifiable (minus
  # `dup` pushes, see test.yml), and the weekly schedule has no base
  # commit to diff against, so filtering there would silently skip the
  # run it exists for.
  detect:
    name: detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ruby: ${{ steps.filter.outputs.ruby }}
      dup: ${{ steps.dup.outputs.dup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Push whose tree already passed this workflow on the PR head → skip.
      - name: duplicate of an already-green PR head (dup)
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dup="$(bin/ci-dup-push .github/workflows/test-ecosystem.yml)"
          [ "$dup" = "true" ] || dup=false
          echo "dup=$dup" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ruby:
              - 'lib/**'
              - 'app/**'
              - 'exe/**'
              - 'test/**'
              - 'tasks/**'
              # bin/test-ecosystem is the harness driver; ecosystem/** is
              # the sidekiq shim gem every harness Gemfile resolves
              # `sidekiq` to.
              - 'bin/**'
              - 'ecosystem/**'
              # Gemfile.lock is deliberately absent from the filter — it
              # is gitignored and can never appear in a diff; `Gemfile`
              # and the gemspec are what actually move dependencies.
              - 'Gemfile'
              - 'Rakefile'
              - '*.gemspec'
              - '.github/workflows/test-ecosystem.yml'

  test-ecosystem:
    needs: detect
    runs-on: ubuntu-latest
    # Measured: ~1 min on a PR, 3-4 min on the cold weekly run.
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4
        # Container port only — Docker binds a free host port. See test.yml.
        ports: ["6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
    env:
      # Per-step gate, not a job-level `if:` — a skipped job reports as a
      # satisfied check. See test.yml's `test` job (#469).
      RUN: ${{ needs.detect.outputs.dup != 'true' && (github.event_name != 'pull_request' || needs.detect.outputs.ruby == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
        with:
          persist-credentials: false
      # ECOSYSTEM_REDIS_URL, not REDIS_URL: bin/test-ecosystem resolves
      # `REDIS_URL="${ECOSYSTEM_REDIS_URL:-...}"` and exports its own
      # value to every harness, so a REDIS_URL set here would be
      # overwritten and never reach them. DB index 15 is what that
      # script already uses — this change is about the port, not the
      # namespace. STEP, not job-level `env:`, since the `job` context
      # is unavailable there.
      - name: resolve redis port
        if: env.RUN == 'true'
        run: echo "ECOSYSTEM_REDIS_URL=redis://localhost:${{ job.services.redis.ports['6379'] }}/15" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        if: env.RUN == 'true'
        with:
          # NOT the newest Ruby, deliberately. This job's subject is
          # third-party gems at pinned upstream SHAs, so it has to run
          # a Ruby *they* support: Ruby 4.0 dropped `benchmark` from the
          # default gems and sidekiq-cron's own test suite requires it,
          # which fails the job on something that is not about Wurk at
          # all. Bump when the pinned suites do.
          ruby-version: "3.4"
          bundler-cache: true
      - name: rake test:ecosystem
        if: env.RUN == 'true'
        run: bundle exec rake test:ecosystem
