  oracles: [BatchParityTest#test_an_empty_jobs_block_synthesises_an_empty_job_and_fires]
- id: batch.child-order
  area: batches
  behavior: Child success fires before parent success.
  source: docs/target/sidekiq-pro.md#L107
  promise: >-
    - Child `:success` fires before parent `:success`. Child `:complete` fires before parent `:complete`. No ordering between child `:success` and parent `:complete`.
  oracles: [BatchParityTest#test_child_success_fires_before_parent_success]
- id: batch.cancel
  area: batches
