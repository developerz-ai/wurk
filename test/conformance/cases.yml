  source: docs/api-http.md#L8-L10
  promise: >-
    **Off unless a token is configured.** With no `config.api_token` registered,
    none of this exists: no route is mounted, no port opens, nothing changes on
    the hot path.
  reason: Machine API tests are not independently sourced parity oracles yet.
  future_work: oracle-api-disabled
- id: web.api-bearer
  area: machine-api
  behavior: Bearer tokens are compared in constant time against every configured token.
  source: docs/api-http.md#L143-L145
  promise: >-
    time against every registered token — no early exit on a match — so timing
    can't leak which token, or how much of one, a caller guessed right.
  reason: No parity oracle measures the machine API comparison contract.
  future_work: oracle-api-bearer-comparison
- id: web.api-missing-token
