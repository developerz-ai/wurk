- id: cron.cluster-leader
  area: cron
  behavior: Wurk uses the single cluster leader rather than a separate cron lock.
  source: docs/target/sidekiq-ent.md#L282-L286
  promise: >-
    > **Wurk divergence (#15):** periodic enqueue is gated by the *single* cluster
