- id: batch.success
  area: batches
  behavior: Success fires once after all jobs succeed.
  source: docs/target/sidekiq-pro.md#L102
  promise: >-
    | `:success` | All jobs in batch (and all descendant batches) succeeded | Fires **once**. Never fires if any job died. |
  oracles: [BatchParityTest#test_success_and_complete_fire_once_with_their_options]
- id: batch.complete
  area: batches
  behavior: Complete fires once even when a job dies.
  source: docs/target/sidekiq-pro.md#L103
  promise: >-
    | `:complete` | Every job executed at least once (success OR exhausted retries) | Fires once. May fire even with failures. |
  oracles: [BatchParityTest#test_a_dead_job_fires_death_and_complete_but_never_success]
- id: batch.death
  area: batches
  behavior: A dead job fires death but not success.
  source: docs/target/sidekiq-pro.md#L104
  promise: >-
    | `:death` | First job in batch exhausts retries / `dead: false` and discards | Fires per-batch on the first death only. Independent of `:complete`. |
  oracles: [BatchParityTest#test_a_dead_job_fires_death_and_complete_but_never_success]
- id: batch.options
  area: batches
  behavior: Callback options survive JSON serialization.
  source: docs/target/sidekiq-pro.md#L108
  promise: >-
    - `options` is JSON-serialised; only basic types allowed.
  oracles: [BatchParityTest#test_callback_options_survive_exactly]
- id: batch.empty
  area: batches
  behavior: An empty jobs block synthesizes an empty job so callbacks fire.
  source: docs/target/sidekiq-pro.md#L75
  promise: >-
    - Empty `#jobs` block is legal as of Pro 7.1 — synthesises a `Sidekiq::Batch::Empty` no-op job so callbacks still fire.
  oracles: [BatchParityTest#test_an_empty_jobs_block_synthesises_an_empty_job_and_fires]
- id: batch.child-order
  area: batches
  behavior: Child success fires before parent success.
  source: docs/target/sidekiq-pro.md#L111
  promise: >-
    - Child `:success` fires before parent `:success`. Child `:complete` fires before parent `:complete`. No ordering between child `:success` and parent `:complete`.
  oracles: [BatchParityTest#test_child_success_fires_before_parent_success]
- id: batch.cancel
  area: batches
  behavior: Invalidated jobs count as success for batch completion.
  source: docs/target/sidekiq-pro.md#L516
  promise: >-
    - **Expired jobs** — count as **success** within a batch. Same for jobs cancelled via `invalidate_all`.
  oracles: [BatchParityTest#test_jobs_cancelled_by_invalidate_all_count_as_success]
- id: batch.callback-retry
  area: batches
  behavior: Callback jobs retry on failure like ordinary jobs.
  source: docs/target/sidekiq-pro.md#L109
  promise: >-
    - Callbacks run as ordinary Sidekiq jobs on `callback_queue`; retry on failure like any job.
  reason: Callback parity assertions do not yet fail and retry a callback job.
  future_work: oracle-batch-callback-retry
- id: batch.marker-collision
  area: batches
  behavior: >-
    A Pro-shaped string marker on b-<bid>-success has the same Redis type as
    Wurk's "already fired" marker but the opposite meaning, so the :success
    callback is lost silently while the :complete callback still fires.
  source: docs/idea/parity-divergences.md#L839-L880
  promise: >-
    Wurk's `EXISTS` gate on `b-<bid>-success` sees Pro's "callbacks pending"
    marker, returns before `enqueue_callbacks`, and the `:success`/`:complete`
    callbacks of an in-flight Pro batch are **lost silently** — no exception,
    no log line, `success_at` never stamped.
  oracles: [BatchParityTest#test_a_pro_shaped_success_marker_suppresses_the_success_callback]
