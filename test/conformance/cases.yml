- id: schedule.reliable-atomic
  area: scheduling
  behavior: Reliable scheduler promotion atomically removes and enqueues due jobs.
  source: docs/target/sidekiq-pro.md#L289-L292
  promise: >-
    Uses one Lua script that **atomically** `ZRANGEBYSCORE` + `ZREM` + `LPUSH` the due jobs into their queue.
  reason: Existing scheduling oracles do not exercise atomic promotion across a crash.
  future_work: oracle-schedule-atomic-promotion
