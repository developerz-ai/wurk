- id: batch.success
  area: batches
  behavior: Success fires once after all jobs succeed.
  source: docs/target/sidekiq-pro.md#L98
  promise: >-
    | `:success` | All jobs in batch (and all descendant batches) succeeded | Fires **once**. Never fires if any job died. |
  oracles: [BatchParityTest#test_success_and_complete_fire_once_with_their_options]
- id: batch.complete
  area: batches
  behavior: Complete fires once even when a job dies.
  source: docs/target/sidekiq-pro.md#L99
  promise: >-
    | `:complete` | Every job executed at least once (success OR exhausted retries) | Fires once. May fire even with failures. |
  oracles: [BatchParityTest#test_a_dead_job_fires_death_and_complete_but_never_success]
- id: batch.death
  area: batches
  behavior: A dead job fires death but not success.
  source: docs/target/sidekiq-pro.md#L100
  promise: >-
    | `:death` | First job in batch exhausts retries / `dead: false` and discards | Fires per-batch on the first death only. Independent of `:complete`. |
  oracles: [BatchParityTest#test_a_dead_job_fires_death_and_complete_but_never_success]
- id: batch.options
  area: batches
  behavior: Callback options survive JSON serialization.
  source: docs/target/sidekiq-pro.md#L104
  promise: >-
    - `options` is JSON-serialised; only basic types allowed.
  oracles: [BatchParityTest#test_callback_options_survive_exactly]
- id: batch.empty
  area: batches
  behavior: An empty jobs block synthesizes an empty job so callbacks fire.
  source: docs/target/sidekiq-pro.md#L71
  promise: >-
