  oracles: [ReliableFetchParityTest#test_paused_queue_is_skipped_until_unpaused]
- id: fetch.recover
  area: reliable-fetch
  behavior: A killed process's in-flight job is recovered exactly once.
  source: docs/target/sidekiq-pro.md#L260
  promise: >-
    - Process death: the 60s TTL belongs to the per-identity heartbeat hash `<identity>`; the `processes` membership SET carries no TTL of its own. Liveness is judged by existence — an identity is alive only while its heartbeat hash still exists, so a SET member whose hash has expired is dead even though it is still listed. Orphan sweeper (1/min within process group, full SCAN 1/hr) finds private queues for dead processes and `RPOPLPUSH`es items back to their public queue.
  oracles: [ReliableFetchParityTest#test_killed_process_in_flight_job_is_recovered_exactly_once]
- id: fetch.poison
  area: reliable-fetch
  behavior: Three orphan recoveries requeue and the fourth orphaning kills the job.
  source: docs/target/sidekiq-pro.md#L519
  promise: >-
    Threshold 3: recoveries while the counter is ≤ 3 requeue, so the job is killed on its 4th orphaning.
  oracles: [ReliableFetchParityTest#test_poison_pill_allows_three_recoveries_and_kills_on_the_fourth_orphaning]
- id: fetch.deferred-ack
  area: reliable-fetch
  behavior: Successful acknowledgements are removed on the next fetch.
  source: docs/idea/parity-divergences.md#L387-L391
  promise: >-
    the `LREM
    <private list> 1 <job JSON>` that retires it is held in the fetcher and sent in
    the **next** fetch's pipeline
  oracles: [ReliableFetchParityTest#test_acknowledged_job_is_gone_after_the_next_fetch]
- id: fetch.terminate-ack
  area: reliable-fetch
  behavior: Termination flushes deferred acknowledgements.
  source: docs/idea/parity-divergences.md#L387-L395
  promise: >-
    Any pending ACK is flushed — as its own round
    trip — before the fetcher blocks in `BLMOVE`, before the all-paused/no-queues
    early return, on `terminate` (quiet), on processor stop, and before
    `bulk_requeue` at shutdown.
  oracles: [ReliableFetchParityTest#test_acknowledged_job_is_gone_after_terminate]
# Free §31 gotchas: scope each claim to the existing assertions, including divergences.
- id: gotcha.fetch-fifo
  area: reliable-fetch
  behavior: Immediate jobs are fetched oldest first from the public queue tail; Wurk uses reliable fetch rather than OSS BRPOP.
  source: docs/target/sidekiq-free.md#L1596
  promise: >-
    **Immediate jobs** go to `queue:<name>` (LPUSH, BRPOP fetch — so FIFO from tail).
  oracles: [ReliableFetchParityTest#test_fetch_is_fifo]
- id: gotcha.reliable-ack-divergence
  area: reliable-fetch
  behavior: Unlike OSS no-op acknowledgement, Wurk's reliable-only fetch removes acknowledged jobs after the next fetch or termination flush.
  source: docs/target/sidekiq-free.md#L1602
  promise: >-
    **`UnitOfWork#acknowledge`** is a no-op in OSS (reliable fetch is Pro-only).
  oracles: [ReliableFetchParityTest#test_acknowledged_job_is_gone_after_the_next_fetch, ReliableFetchParityTest#test_acknowledged_job_is_gone_after_terminate]
- id: gotcha.shutdown-bulk-requeue
  area: reliable-fetch
  behavior: Shutdown bulk_requeue returns in-progress jobs to their own public queues exactly once at the fetch end, excluding acknowledged jobs after flushing Wurk's deferred ACKs.
  source: docs/target/sidekiq-free.md#L1603
  promise: >-
    **`bulk_requeue` on hard shutdown** uses `RPUSH` (head of queue, FIFO preserved).
  oracles: [ReliableFetchParityTest#test_bulk_requeue_returns_every_in_progress_job_once, ReliableFetchParityTest#test_bulk_requeue_puts_jobs_at_the_fetch_end, ReliableFetchParityTest#test_bulk_requeue_never_resurrects_an_acknowledged_job]
