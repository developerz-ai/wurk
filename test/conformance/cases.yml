  behavior: Requiring sidekiq/middleware/i18n registers I18n client and server middleware.
  source: docs/target/sidekiq-free.md#L692-L698
  promise: >-
    | `Sidekiq::Middleware::I18n::Client/Server` | `require "sidekiq/middleware/i18n"` | persists `I18n.locale` across job |
  reason: No isolated parity oracle inspects I18n middleware registration after requiring its entrypoint.
  future_work: oracle-builtin-i18n-registration
- id: builtin.i18n-locale
  area: builtin-middleware
  behavior: I18n middleware preserves the enqueue-time locale across job execution.
  source: docs/target/sidekiq-free.md#L698
  promise: >-
    persists `I18n.locale` across job
  reason: No parity oracle enqueues under one locale and observes that locale during job execution.
  future_work: oracle-builtin-i18n-locale
