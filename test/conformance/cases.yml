  source: docs/target/sidekiq-pro.md#L255-L259
  promise: >-
    - Job remains in the private queue until the worker explicitly `LREM`s it after success or retry handling.
  oracles: [ReliableFetchParityTest#test_fetch_returns_the_exact_payload_and_parks_it_out_of_the_public_queue]
- id: fetch.isolated
  area: reliable-fetch
  behavior: A fetched job is invisible to another fetcher.
  source: docs/target/sidekiq-pro.md#L255-L259
  promise: >-
    atomic move from public list tail to private list head.
  oracles: [ReliableFetchParityTest#test_fetched_job_is_invisible_to_other_fetchers]
- id: fetch.pause
  area: reliable-fetch
  behavior: Paused queues are skipped until unpaused.
  source: docs/target/sidekiq-pro.md#L327
  promise: >-
    Fetcher (`super_fetch` or basic_fetch in Pro mode) skips any queue listed in `paused`. Existing in-flight jobs continue.
  oracles: [ReliableFetchParityTest#test_paused_queue_is_skipped_until_unpaused]
- id: fetch.recover
  area: reliable-fetch
  behavior: A killed process's in-flight job is recovered exactly once.
  source: docs/target/sidekiq-pro.md#L260
  promise: >-
    - Process death: the 60s TTL belongs to the per-identity heartbeat hash `<identity>`; the `processes` membership SET carries no TTL of its own. Liveness is judged by existence — an identity is alive only while its heartbeat hash still exists, so a SET member whose hash has expired is dead even though it is still listed. Orphan sweeper (1/min within process group, full SCAN 1/hr) finds private queues for dead processes and `RPOPLPUSH`es items back to their public queue.
  oracles: [ReliableFetchParityTest#test_killed_process_in_flight_job_is_recovered_exactly_once]
- id: fetch.poison
  area: reliable-fetch
  behavior: Three orphan recoveries requeue and the fourth orphaning kills the job.
  source: docs/target/sidekiq-pro.md#L519
  promise: >-
    Threshold 3: recoveries while the counter is ≤ 3 requeue, so the job is killed on its 4th orphaning.
  oracles: [ReliableFetchParityTest#test_poison_pill_allows_three_recoveries_and_kills_on_the_fourth_orphaning]
- id: fetch.deferred-ack
  area: reliable-fetch
  behavior: Successful acknowledgements are removed on the next fetch.
  source: docs/idea/parity-divergences.md#L388-L392
  promise: >-
    the `LREM
    <private list> 1 <job JSON>` that retires it is held in the fetcher and sent in
    the **next** fetch's pipeline
  oracles: [ReliableFetchParityTest#test_acknowledged_job_is_gone_after_the_next_fetch]
- id: fetch.terminate-ack
  area: reliable-fetch
  behavior: Termination flushes deferred acknowledgements.
  source: docs/idea/parity-divergences.md#L388-L396
  promise: >-
    Any pending ACK is flushed — as its own round
    trip — before the fetcher blocks in `BLMOVE`, before the all-paused/no-queues
    early return, on `terminate` (quiet), on processor stop, and before
    `bulk_requeue` at shutdown.
  oracles: [ReliableFetchParityTest#test_acknowledged_job_is_gone_after_terminate]
- id: cron.payload
  area: cron
