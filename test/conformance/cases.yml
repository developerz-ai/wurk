  oracles: [UniqueParityTest#test_scheduled_lock_covers_delay_plus_unique_for]
- id: unique.success
  area: uniqueness
  behavior: Success-mode locks release when the job succeeds.
  source: docs/target/sidekiq-ent.md#L364
  promise: >-
    | `perform` succeeds        | lock DELed                                               | (already gone)                                                 |
  oracles: [UniqueParityTest#test_until_success_releases_on_success]
- id: unique.failure
  area: uniqueness
  behavior: Success-mode locks survive a failure while the job retries.
  source: docs/target/sidekiq-ent.md#L363
  promise: >-
