  reason: Periodic oracles do not yet establish leadership with competing processes.
  future_work: oracle-cron-cluster-leader
- id: crypto.envelope
  area: encryption
  behavior: Wurk uses the documented JSON GCM envelope rather than upstream binary crypto format.
  source: docs/target/sidekiq-ent.md#L423-L437
  promise: >-
    In Redis the job's last arg becomes a JSON Hash envelope (not a base64 blob of a
    binary envelope — the args array stays valid JSON for inspectors):
  oracles: [EncryptionParityTest#test_envelope_fields_and_gcm_round_trip]
- id: crypto.decrypt-failure
  area: encryption
  behavior: A decrypt failure dead-sets the job tagged with Wurk::Encryption::DecryptionError and never retries it.
  source: docs/idea/parity-divergences.md#L1241-L1249
  promise: >-
    a decrypt failure (unknown key version, a key resolver that returns nil or
    raises, a corrupt envelope) raises `Wurk::Encryption::DecryptionError`,
    increments `jobs.encryption_error`, and moves the job to the dead set
    without retries.
  oracles: [EncryptionParityTest#test_forged_tag_dead_sets_as_encryption_error_without_retry]
- id: web.dashboard-auth
  area: dashboard
  behavior: A falsey authorization hook denies dashboard requests with 403.
  source: docs/dashboard.md#L71-L74
  promise: >-
    A falsey return short-circuits to `403`. `path` is engine-relative
    (`/api/stats`, not the host's absolute `/wurk/api/stats`), matching Sidekiq's
    contract.
  reason: No dashboard authorization oracle exists in the parity suite.
  future_work: oracle-dashboard-authorization
- id: web.dashboard-readonly
  area: dashboard
  behavior: Read-only mode denies every mutating request with 403.
  source: docs/dashboard.md#L78-L80
  promise: >-
    `WURK_WEB_READ_ONLY=1` — every mutating request 403s and the SPA hides
    destructive actions.
  reason: Dashboard read-only checks have not been promoted to source-first parity assertions.
  future_work: oracle-dashboard-readonly
- id: web.dashboard-middleware
  area: dashboard
  behavior: Host middleware runs before the dashboard authorization hook.
  source: docs/dashboard.md#L22-L24
  promise: >-
    The two compose. `Wurk::Web.use` middleware runs **first** (outermost), so by
    the time the `authorization` block runs, the host middleware has already
    populated `env` (e.g. `env['warden']`).
  reason: Parity has no host middleware ordering oracle.
  future_work: oracle-dashboard-middleware-order
- id: web.api-off
