# Toolchain, as text: the fleet box provides `mise` and nothing per-language, and
# `bin/setup` runs `mise install` (guarded, so a box without mise skips it). The
# ruby version is the one the Dockerfile and the pages/ecosystem CI lanes run;
# the main test lane runs 4.0 — change this line, not a box, to move the fleet.
#
# bun and node MUST stay in lock-step with the CI pins: `bun-version:` on the
# `oven-sh/setup-bun` steps in .github/workflows/test.yml and release.yml,
# `node-version:` on the `actions/setup-node` steps in test.yml, and the
# Dockerfile's `oven/bun` base tag. Bumping one without the others leaves the
# fleet and CI on different runtimes and silently re-introduces the
# unpinned-toolchain failure this file exists to prevent.
[tools]
ruby = "3.4"
bun = "1.4.2"
node = "24"
