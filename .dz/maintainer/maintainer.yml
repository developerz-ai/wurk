# yaml-language-server: $schema=https://developerz.ai/schemas/maintainer.v1.json
# developerz.ai maintainer policy — developerz-ai/wurk
#
# FULLY AI-MAINTAINED (2026-10-10; the 2026-10-14 members split reversed 2026-10-23, owner ruling:
# "wurk and ultimate should be full ai maintained"). For everyone, org members and collaborators
# included, and for the dependency bots, the agent handles issues, pull requests and updates end to
# end: it triages, answers or stays silent, reviews, declines with a reason, merges on green, and
# closes what has stalled on its reporter or author. `escalate` names nothing, so a human is asked
# only for the platform's hardcoded categories (security, license, CLA). Releases follow the work:
# the `release-due` checkup files the bump when a shipping fix has waited, and release.yml
# publishes; `release.manager` stays `none`.
#
# Dogfood pass with coding handoff live. The bot triages (qualifies, labels,
# asks reporters for repro) and, once a task is ready, dispatches coding to the
# fleet (handoff.mode: fleet). Auto-merge is ON as of 2026-09-01 — see the pr:
# block for the history and for what stands behind it. It is NOT this file: the
# live `main-protection` ruleset now carries a required_status_checks rule
# (dz#2798), so CI green is enforced by the repo, not by a line in here. That
# sentence has been rewritten twice for the same reason and the reason is worth
# keeping: a note here claiming what protects `main` goes stale the moment
# someone edits the ruleset, and a stale one reads as a guarantee. Read the
# ruleset before trusting any sentence in this file about it —
# `gh api repos/developerz-ai/wurk/rulesets`. (Prior wrong versions: "legacy
# branch protection exists (1 required review + the test matrix)", false from
# 2026-08-07 when the ruleset replaced it — wurk#445 flagged it, wurk#388 was
# the outage it caused; then "no required-status-checks rule", false from
# 2026-09-01T05:12Z.) We still wait
# for reviewer bots (coderabbit/copilot) to settle before acting. The native
# review: block below activates the developerz review lane alongside CodeRabbit
# (force: true — requests changes on a finding that must be fixed, never
# approves). Everything
# not set here uses the schema defaults. release: is now declared explicitly
# (see the release: block) rather than inherited, because the inherited default
# described a lane this repo does not run.
version: 1

# THE SERVICES THIS REPO'S OWN GATE NEEDS BEFORE IT CAN GRADE A DIFF
# (developerz-ai/developerz.ai#2918, mechanism in #2919).
#
# `bin/check` refuses without a reachable Redis at `REDIS_URL` (falling back to
# redis://localhost:6379/0 when unset; since wurk#538 it no longer pins
# 127.0.0.1:6379) -- integration and parity tests use a real server, never a
# mock -- and that refusal is correct. What was
# wrong is what happened next: every box in the fleet claimed this repo's coding
# work, the agent produced the correct edit, passed its own guard, and the gate
# discarded it in 60 ms for want of a service the box never had. Three attempts,
# three times, each one filed as a bad diff.
#
# Declaring it turns "claimed and thrown away" into "claimed by a box that can
# actually grade it". The platform mints a `service:redis` capability token into
# the claim gate's requirement set, and a box adverts that token only by opening
# a real connection to the port -- so this line routes the work rather than
# describing an intention. A task no box can serve is HELD with
# `no_service_capacity` naming the gap (#2920), instead of sitting pending and
# silent.
#
# CLOSED VOCABULARY (`redis` | `postgres`): this key can never name an image or a
# command, which is what keeps a `.maintainer.yml` from being a way to start a
# process on somebody's box.
services: [redis]

tone:
  voice: friendly
  language: en

triage:
  # No `skip_project_members` (schema default false; owner ruling 2026-10-23: "wurk and ultimate
  # should be full ai maintained"). An issue opened by an org member or an invited collaborator is
  # triaged, picked up from the backlog and stale-swept like anyone's; the 2026-10-14 rule that left
  # it to its author is reversed.
  # Which deployments count as "the fix was deployed" for the error-fix confirmation
  # (developerz.ai #5657, owner ruling 2026-10-16). The default is `[production]`, and this
  # repo never deploys to an environment by that name: its deployments are `demo` (the
  # wurk-demo app, built from `main`) and `github-pages` (the docs site). Only `demo` runs
  # the code, so only `demo` counts; a docs deploy must not confirm a fix. Read back
  # 2026-10-17: developerz.ai has recorded 16 `demo` and 22 `github-pages` success verdicts
  # for this repo, and the last three `demo` deployments were `main` commits.
  error_fix_confirm_environments: [demo]
  ask_for_repro: true
  required_fields: [steps, expected, actual, version]
  qualify_into: [bug, feature, dupe, question]
  # Dogfood: lower than the 0.6 default so a moderately-scoped plan hands off to
  # the coding fleet instead of escalating for review (exercises the handoff loop).
  confidence_threshold: 0.4
  # An issue waiting on its reporter for the repro fields is reminded at 7 days
  # and closed at 14, with the missing items and the way to reopen. Only the
  # reporter's silence is timed; a confirmed or accepted issue is never closed
  # by a clock.
  close_unanswered_repro_after_days: 14
  # What this project will not take, from CLAUDE.md's "Never" list: the entries
  # that describe a change someone could propose. The two left out
  # (`--no-verify`, force-pushing `main`) are rules for how to work, not
  # proposals. A pull request that matches an entry is closed with it quoted;
  # an issue is answered with it.
  non_goals:
    - "Changing a Redis key, the job JSON format, or a sorted-set score format: wire compatibility with Sidekiq is the contract"
    - "MessagePack or any other non-JSON job format"
    - "A license check, a paid tier, or a flag that gates a Pro or Enterprise feature"
    - "Breaking a Sidekiq::* alias or diverging from the documented Sidekiq API"
    - "Mocking Redis in integration or parity tests"
    - "Sharing a Redis socket across forks"
    - "Backwards-compatibility shims, dead-code comments, or speculative abstractions"
    - "Outside human contributors' changes to CI, release or publish automation (.github/, bin/, release tasks, RELEASE.md, Wurk::VERSION): members own the gem pipeline"

handoff:
  # `fleet`, not `webhook`: both grant HandoffWebhook
  # (developerz-ai/developerz.ai packages/tools/src/policy-gate.ts:83) but `fleet`
  # needs no `webhook_ref` (packages/policy/src/validate.ts:130, dz#1026), and the
  # `wh_fleet_placeholder` ref that used to sit here resolved to no row and threw
  # WebhookRefNotFoundError — the org account has zero registered webhooks, so
  # the ingest graded the WHOLE file INVALID and served defaultPolicy instead
  # (wurk#432). Every declared value below only takes effect once this is gone.
  # This key is also the opt-in for the autonomous scout backlog-drain. That
  # drain is LIVE, not inert (wurk#488): as of developerz.ai `b4cfe94d76e9`
  # (2026-09-14) it is an attached lane, registered at
  # apps/worker/src/wiring/lanes.generated.ts:121, and it fired 814 times
  # fleet-wide in the 30 days to 2026-09-14, 8 of them on this repo. A previous
  # version of this comment said it "stays inert until dz#1249 and dz#1530
  # close"; that was false. Re-check against developerz.ai main before relying
  # on either the date or the counts. Enrolling wurk was authorized by Ivan
  # (ivndev001) 2026-08-21 on wurk#445.
  mode: fleet
  ask_reporter_first: false

pr:
  wait_for_other_bots: [coderabbit, copilot]
  # UNPINNED 2026-09-01, on the exit condition the pin itself named: "restored
  # only behind a ruleset or a fresh explicit operator decision". Both arrived.
  #
  # HISTORY, kept because it is why this line was ever `false`. Pinned off
  # 2026-08-01 (operator decision, developerz-ai/wurk#345): until wurk#432/#445
  # the file was semantically invalid (handoff.webhook_ref named no registered
  # webhook), so the platform discarded it whole and ran defaultPolicy — whose
  # pr.auto_merge is false. Activating the file with the previously declared
  # `true` would have flipped auto-merge ON with nothing behind it, because the
  # `main-protection` ruleset then required zero approving reviews AND no status
  # checks. That is no longer true, and leaving the old sentence here would be a
  # comment asserting a state the repo no longer has.
  #
  # WHAT IS BEHIND IT NOW (dz#2798, ruleset 20556704, updated 2026-09-01T05:12Z,
  # read back before this change): a `required_status_checks` rule requiring
  # `test + coverage (latest ruby/rails)`, `lint (rubocop)` and `parity (oracle)`,
  # since grown to the six listed under `required_checks` below.
  # HOW THEY STAY HONEST (wurk#469, wurk#541, as of 2026-10-04): none of the
  # jobs carries a job-level `if:` — GitHub counts a SKIPPED required job as
  # passing, so a job-level skip was a pass that ran nothing. Each job is always
  # created and always reports; a per-step `RUN` env (event is not a PR, or the
  # PR touched a path the job grades) decides whether its steps do work, and
  # the paths filter covers the docs the doc-claim tests read. The other wedge —
  # a bun.lock reconcile pushed by GITHUB_TOKEN, which triggers no workflows and
  # so left the new head with no required checks at all (wurk#527 sat BLOCKED on
  # it) — is gone with its workflow: dependabot's `bun` ecosystem updates
  # bun.lock in its own commit, which runs CI like any other push. Verify with
  # `gh pr checks <n>` on a docs-only PR: all six contexts must appear, and
  # a SKIPPED one means this paragraph has gone stale.
  # `strict_required_status_checks_policy: false`, so `main`
  # moving does not force a rebase on every open PR. Still no classic branch
  # protection behind the ruleset (404), so the ruleset IS the gate.
  #
  # WHAT IS STILL NOT BEHIND IT, stated rather than assumed:
  # `required_approving_review_count` is 0. Merges are gated by MACHINES — CI
  # green plus the ruleset — not by a human review, which is the platform's
  # documented auto-merge posture and not an oversight. The shape wurk#450 got
  # through (a red `test + coverage`, merged 24 seconds later) is no longer
  # expressible.
  #
  # ONE EXCEPTION the count of 0 hides (wurk#488): the ruleset's pull_request
  # rule sets `require_extra_approval_for_unattributed_changes: true` (read
  # back via `gh api repos/developerz-ai/wurk/rulesets/20556704`, ruleset id
  # stable since 2026-08-07), so a PR whose commits include any not attributed
  # to a GitHub account needs one human approval before the bot's auto-merge
  # will fire. Every squash on main is attributed (author.login non-null on
  # the last 40, re-checked 2026-10-04), so this has not gated a PR yet — the day a fleet
  # box commits with an email not linked to a GitHub account, that PR silently
  # parks and the bot cannot move it. CONTRIBUTING.md tells contributors to
  # commit with a GitHub-linked email for exactly this reason. The rule in this
  # file's header says it must not assert a ruleset state it
  # does not have, and the count-of-0 sentence above would be one of those
  # assertions without this caveat.
  # Dependabot pull requests merge through this lane too, and only this lane: the
  # GitHub Actions workflow that armed GitHub's native auto-merge on them
  # (dependabot-automerge.yml, wurk#347) was removed 2026-10-11, because a second
  # merger beside the agent is one that skips its review. A major bump is not
  # held for a human (`escalate.ask_before_acting` below is empty); the six
  # required checks and the agent's review are what gate it.
  auto_merge: true
  # WHOSE pull requests the bot merges and babysits: every author's (owner ruling 2026-10-23: "wurk
  # and ultimate should be full ai maintained"; it reverses the 2026-10-14 `not_project` scope that
  # left members' PRs to their authors). `any`: the bot's own, the dependency bots', outside
  # contributors', and org members' and collaborators' alike: reviewed, babysat, merged on green.
  # An OUTSIDE PR that changes CI, release or publish automation is still declined by the
  # `non_goals` line above (security review, 2026-10-14): an auto-merged workflow edit would run
  # beside the release job's RubyGems OIDC identity. Whether an author is outside is the platform's
  # read of their real repo permission, never `author_association` (developerz.ai #6363).
  auto_merge_scope: any
  # The `main-protection` ruleset's six, named here so the agent knows which red
  # check is the author's to fix. The ruleset is still the gate; this list is
  # what the stalled-PR sweep and the merge gate read. Re-check against
  # `gh api repos/developerz-ai/wurk/rulesets` when either changes.
  required_checks:
    - "test + coverage (latest ruby/rails)"
    - "lint (rubocop)"
    - "parity (oracle)"
    - "spec docs (exist + non-empty)"
    - "frontend (vitest)"
    - "actionlint (workflow lint)"
  # A pull request whose next move is its author's (a red required check, an
  # unresolved review thread, a change request, a conflict) is pinged at 7 and
  # 14 days and closed at 21 (a draft at 28), with the reason and the way to
  # reopen. One waiting on us, on a reviewer, or on CI is never timed.
  close_awaiting_author_after_days: 21

review:
  enabled: true
  force: true                 # CodeRabbit is active on wurk; without this we defer forever
  depth: inline               # not deep — no checkout guarantee, avoids review.depth_unservable
  profile: chill
  request_changes: true       # a finding that must be fixed is a change request, as a maintainer's would be
  approval: false             # first live pass must not APPROVE
  high_level_summary: true
  learnings: false            # no KB write-back on a public repo yet
  chat_auto_reply: true       # keep on — the reply lane is the positive control
  auto_review:
    enabled: true
    incremental: true
    drafts: false
    base_branches: [main]     # verified: wurk's default branch is main
    ignore_title_keywords: [WIP, "DO NOT MERGE"]
  anti_noise:
    severity_floor: minor
    max_comments: 10          # DELIBERATE — pins defaultAntiNoise's 10, defeats the schema's 30
    dedupe: true
  path_filters: []
  path_instructions: []

release:
  # DECLARED, not inherited (wurk#328). The schema default is
  # manager: release-please, which implies batched release PRs driven by
  # release-please-config.json + .release-please-manifest.json. Neither file
  # exists here and no release PR has ever been opened, so the inherited
  # default described a lane this repo does not run.
  #
  # What actually cuts a release:
  #   1. a version bump to lib/wurk/version.rb lands on main
  #   2. .github/workflows/release.yml fires on that path, publishes to RubyGems
  #      via OIDC trusted publishing, and only then cuts the tag + GitHub Release
  #      from the CHANGELOG section
  #
  # `none` is the only value in the enum (release-please | none) that describes
  # that, and it means "no release MANAGER" — it does not govern the agent's
  # note generation, which the schema does not model at all.
  manager: none
  # EMPTIED 2026-08-11 (wurk#420). `manager: none` did NOT stop the agent from
  # cutting releases — `channels: [github-release]` did that independently, and
  # it fired on feature merges with Wurk::VERSION unbumped. Six times (v1.2.1,
  # v1.5.0, v1.6.0, v1.7.0, v1.8.0, v1.7.1, v1.7.2) that produced a tag and a
  # GitHub Release marked "Latest" with no gem behind it, while `gem install
  # wurk` kept serving the previous version — and a red release run each time.
  # release.yml owns the whole lane end to end (gem first, then tag + Release
  # from the CHANGELOG), so there is no channel left for the agent to publish on.
  # The registry channels (incl. rubygems) are reserved and REJECTED at
  # validation time regardless; RubyGems is declared by release.yml's OIDC step.
  channels: []

escalate:
  # Narrowed 2026-10-10 from the schema's four to `breaking_change`, emptied
  # 2026-10-23 (owner ruling: "wurk and ultimate should be full ai maintained").
  # A breaking change, a major dependency bump, a first-time contributor's pull
  # request and a large pull request are all the agent's to judge: the drop-in
  # contract is its to keep, and a change that breaks it is declined by the
  # `non_goals` above, not parked for a human. The platform's hardcoded asks
  # (security, license, CLA) still apply; this list cannot remove them.
  ask_before_acting: []

# The checkups nothing else triggers (owner, 2026-10-14: maintained so nobody has to watch it). Is a
# release owed, and is the project healthy. Bot-authored alarm issues never pass intake, so a red
# `main` or a release run that did not publish reaches the bot only through `health`.
#
# The last three entries are READ-ONLY SCOUTS: they read the repo and report a finding, and never
# edit a file, commit, push or open a pull request. Their briefs live in .dz/schedules/; the two
# checkups above keep theirs in .dz/briefs/.
schedules:
  - name: release-due
    days: [mon, tue, wed, thu, fri]
    hours_utc: [6]
    brief_file: .dz/briefs/release-due.md
  - name: health
    days: [mon, tue, wed, thu, fri, sat, sun]
    hours_utc: [7]
    brief_file: .dz/briefs/health.md
  - name: coverage-gaps
    days: [tue]
    hours_utc: [8]
    brief_file: .dz/schedules/coverage-gaps.md
  - name: docs-drift
    days: [thu]
    hours_utc: [9]
    brief_file: .dz/schedules/docs-drift.md
  - name: sidekiq-parity
    days: [sat]
    hours_utc: [10]
    brief_file: .dz/schedules/sidekiq-parity.md
